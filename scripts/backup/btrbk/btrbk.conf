# btrbk configuration for the econ-graph production data on threadripper.
# Installed to /etc/btrbk/btrbk.conf by scripts/host/install-btrbk.sh, which
# also makes btrbk.timer hourly. Runbook: docs/deployment/BACKUPS.md.
#
# Layout (all on the /home btrfs RAID10, UUID 03ee0fcb-...; created by
# scripts/host/setup-subvolumes.sh):
#   /srv/econgraph/data-plane  @econgraph-data-plane  pg/ (econ_graph), objects/
#   /srv/econgraph/app-prod    @econgraph-app-prod    keycloak-pg/, later the app DB
#   /srv/econgraph/snapshots   @econgraph-snapshots   read-only snapshots (this file's output)
#
# Consistency: each Postgres data directory, WAL included, lives entirely
# inside one subvolume, and a btrfs snapshot is atomic for the whole
# subvolume. A snapshot is therefore crash-consistent: starting Postgres on
# it is the same as starting after a power cut, and WAL replay brings it to
# a consistent state. pg/ and objects/ share one subvolume on purpose, so a
# single snapshot captures both at the same instant. Never split them into
# separate subvolumes, and never put a Postgres data directory's pg_wal on a
# different subvolume (or a symlink out of it): the snapshots would stop
# being consistent.
#
# Nested subvolumes are NOT included in a snapshot. Never create a
# subvolume inside data-plane or app-prod.
#
# Snapshots named <name>.pre-<stamp>-<reason> come from
# scripts/backup/snapshot-now.sh. They do not match btrbk's naming, so btrbk
# never prunes them; delete them with scripts/host/delete-snapshots.sh.

# long-iso: YYYYMMDDTHHMMSS+hhmm, unambiguous across DST changes and parsed
# by scripts/backup/check-freshness.sh.
timestamp_format        long-iso

# Hourly timer, and a snapshot every run even if nothing changed, so the
# freshness check can rely on snapshot age.
snapshot_create         always

# Retention: every hourly snapshot for 48h, then one per day for 30 days,
# then one per month for 12 months. Daily/monthly picks are the first
# snapshot after 00:00 local time / the first of the month.
snapshot_preserve_min   latest
snapshot_preserve       48h 30d 12m
preserve_hour_of_day    0
preserve_day_of_week    sunday

incremental             yes

snapshot_dir            /srv/econgraph/snapshots

# Local backup target: a new top-level subvolume @econgraph-backups on the
# 3-disk Samsung 870 SATA btrfs pool (UUID a1e61098-087b-4403-8765-b714bf7b240b,
# sda1/sdb1/sdc1), mounted at /srv/econgraph-backups by
# scripts/host/setup-backup-pool.sh. It is a different filesystem from
# /home, so snapshots get there only by btrfs send/receive (incremental
# after the first full send). The "#SATA# " lines are commented out here and
# switched on by scripts/host/install-btrbk.sh when that mount exists (it
# renders the config with the prefix stripped), so this file never refers to
# a target that isn't there. The target keeps a longer history than the
# source: it is the copy that survives losing the NVMe array.
#SATA# target_preserve_min    no
#SATA# target_preserve        14d 8w 24m

subvolume /srv/econgraph/data-plane
    snapshot_name       data-plane
#SATA#     target              send-receive /srv/econgraph-backups/btrbk

subvolume /srv/econgraph/app-prod
    snapshot_name       app-prod
#SATA#     target              send-receive /srv/econgraph-backups/btrbk
