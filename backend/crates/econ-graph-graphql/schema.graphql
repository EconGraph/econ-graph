	dataPoints(filter: DataFilter, transformation: DataTransformation): [DataPoint!]!
}

type Mutation {
	"""
	Enqueue crawl jobs (requires `admin.crawlers:manage`). Nothing is crawled in the
	request: the jobs go to `crawl_queue` and the crawler workers process them.
	
	`series_ids` become `fetch_series` jobs for `source` (or for the single entry of
	`sources`); every listed source without series gets a `discover_catalog` job. Returns the
	current crawler status with `enqueuedCount` = jobs actually inserted (a job with an active
	duplicate in the queue is skipped and not counted).
	"""
	triggerCrawl(input: TriggerCrawlInput!): CrawlerStatus!
	"""
	Create a new chart annotation
	"""
	createAnnotation(input: CreateAnnotationInput!): ChartAnnotationType!
	"""
	Add a comment to an annotation
	"""
	addComment(input: AddCommentInput!): AnnotationCommentType!
	"""
	Share a chart with another user
	"""
	shareChart(input: ShareChartInput!): ChartCollaboratorType!
	"""
	Update an annotation (only its author may update it)
	"""
	updateAnnotation(input: UpdateAnnotationInput!): ChartAnnotationType!
	"""
	Delete an annotation
	"""
	deleteAnnotation(input: DeleteAnnotationInput!): Boolean!
	"""
	Update user information (requires `admin.users:update`; changing `isActive` also
	requires `admin.users:suspend`). Roles are assigned in the identity provider.
	"""
	updateUser(id: ID!, input: UpdateUserInput!): UserType!
	"""
	Delete a user (requires `admin.users:delete`)
	"""
	deleteUser(id: ID!): Boolean!
	"""
	Suspend a user account (requires `admin.users:suspend`)
	"""
	suspendUser(id: ID!): Boolean!
	"""
	Activate a user account (requires `admin.users:suspend`)
	"""
	activateUser(id: ID!): Boolean!
}

"""
ISO 8601 calendar date without timezone.
Format: %Y-%m-%d

# Examples

* `1994-11-13`
* `2000-02-24`
"""
scalar NaiveDate

"""
Page information for pagination
"""
type PageInfo {
	hasNextPage: Boolean!
	hasPreviousPage: Boolean!
	startCursor: String
	endCursor: String
}

input PaginationInput {
	first: Int
	after: String
	last: Int
	before: String
}

type Query {
	"""
	Get a specific economic series by ID
	"""
	series(id: ID!): EconomicSeriesType
	"""
	List economic series with filtering and pagination
	"""
	seriesList(filter: SeriesFilter, pagination: PaginationInput): SeriesConnection!
	"""
	Get a specific data source by ID
	"""
	dataSource(id: ID!): DataSourceType
	"""
	List all data sources
	"""
	dataSources: [DataSourceType!]!
	"""
	Get data points for a specific series with filtering and transformation
	"""
	seriesData(seriesId: ID!, filter: DataFilter, transformation: DataTransformation, first: Int, after: String): DataPointConnection!
	"""
	Crawler status, derived from the crawl queue (workers keep no other state).
	"""
	crawlerStatus: CrawlerStatus!
	"""
	Get queue statistics
	"""
	queueStatistics: QueueStatistics!
	"""
	Search economic series using full-text search with spelling correction
	"""
	searchSeries(query: String!, source: String, frequency: SeriesFrequency, first: Int, after: String): SearchResult!
	"""
	Get search suggestions for partial queries
	"""
	searchSuggestions(partialQuery: String!, limit: Int): [SearchSuggestionType!]!
	"""
	Get annotations for a specific series: public ones, plus the caller's own private ones.
	"""
	annotationsForSeries(seriesId: String!, userId: ID @deprecated(reason: "Ignored: the viewer is the signed-in caller")): [ChartAnnotationType!]!
	"""
	Get comments for an annotation the caller can see (public, or their own)
	"""
	commentsForAnnotation(annotationId: ID!): [AnnotationCommentType!]!
	"""
	Get collaborators for a specific chart. Requires sign-in; only the chart's own
	collaborators see the list, everyone else gets an empty one.
	"""
	chartCollaborators(chartId: ID!): [ChartCollaboratorType!]!
	"""
	Get user information by ID. Callers may read their own record; reading anyone else's
	requires `admin.users:read`.
	"""
	user(userId: ID!): UserType
	"""
	Get all users (requires `admin.users:read`)
	"""
	users(filter: UserFilterInput, pagination: PaginationInput): UserConnection!
	"""
	Get system health metrics (requires `admin.system:read`)
	"""
	systemHealth: SystemHealthType!
	"""
	Get security events (requires `admin.security:read`)
	"""
	securityEvents(limit: Int): [SecurityEventType!]!
	"""
	Get audit logs (requires `admin.audit:read`)
	"""
	auditLogs(filter: AuditLogFilterInput, pagination: PaginationInput): AuditLogConnection!
}

