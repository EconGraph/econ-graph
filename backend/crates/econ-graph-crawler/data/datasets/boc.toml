# Bank of Canada dataset definitions. See README.md in this directory for the format.
#
# Valet series names (V39079, FXUSDCAD, BD.CDN.10YR.DQ.YLD) are opaque keys chosen by the Bank of
# Canada, not combinations of dimension values, so Valet is one dataset with no dimensions and
# every series keeps its Valet name as its external id (see src/sources/boc.rs).

[[dataset]]
code = "valet"
name = "Bank of Canada Valet"
description = "Series published by the Bank of Canada through its Valet web services"
