# World Bank dataset definitions. See README.md in this directory.
#
# The indicator codes below must match data/wdi_indicators.csv, which the adapter crawls and
# which carries each indicator's unit (a test checks the two agree). Each series stores its
# indicator's unit in `units`; the code list here carries labels only.

[[dataset]]
code = "wdi"
name = "World Development Indicators"
description = "World Bank development indicators, one series per indicator and country or aggregate"

# Canonical ids: wdi/{indicator}.{area}, for example wdi/NY.GDP.PCAP.CD.USA
[[dataset.dimensions]]
name = "indicator"
label = "Indicator"

codes = [
  { code = "NY.GDP.MKTP.CD", label = "GDP (current US$)" },
  { code = "NY.GDP.MKTP.KD", label = "GDP (constant 2015 US$)" },
  { code = "NY.GDP.MKTP.KD.ZG", label = "GDP growth (annual %)" },
  { code = "NY.GDP.MKTP.PP.CD", label = "GDP, PPP (current international $)" },
  { code = "NY.GDP.PCAP.CD", label = "GDP per capita (current US$)" },
  { code = "NY.GDP.PCAP.KD", label = "GDP per capita (constant 2015 US$)" },
  { code = "NY.GDP.PCAP.KD.ZG", label = "GDP per capita growth (annual %)" },
  { code = "NY.GDP.PCAP.PP.CD", label = "GDP per capita, PPP (current international $)" },
  { code = "NY.GNP.PCAP.CD", label = "GNI per capita, Atlas method (current US$)" },
  { code = "NY.GDP.DEFL.KD.ZG", label = "Inflation, GDP deflator (annual %)" },
  { code = "NE.CON.PRVT.ZS", label = "Households and NPISHs final consumption expenditure (% of GDP)" },
  { code = "NE.CON.GOVT.ZS", label = "General government final consumption expenditure (% of GDP)" },
  { code = "NE.GDI.TOTL.ZS", label = "Gross capital formation (% of GDP)" },
  { code = "NY.GNS.ICTR.ZS", label = "Gross savings (% of GDP)" },
  { code = "NV.AGR.TOTL.ZS", label = "Agriculture, forestry, and fishing, value added (% of GDP)" },
  { code = "NV.IND.TOTL.ZS", label = "Industry (including construction), value added (% of GDP)" },
  { code = "NV.IND.MANF.ZS", label = "Manufacturing, value added (% of GDP)" },
  { code = "NV.SRV.TOTL.ZS", label = "Services, value added (% of GDP)" },
  { code = "FP.CPI.TOTL", label = "Consumer price index (2010 = 100)" },
  { code = "FP.CPI.TOTL.ZG", label = "Inflation, consumer prices (annual %)" },
  { code = "PA.NUS.FCRF", label = "Official exchange rate (LCU per US$, period average)" },
  { code = "PA.NUS.PPP", label = "PPP conversion factor, GDP (LCU per international $)" },
  { code = "SL.UEM.TOTL.ZS", label = "Unemployment, total (% of total labor force) (modeled ILO estimate)" },
  { code = "SL.UEM.1524.ZS", label = "Unemployment, youth total (% of total labor force ages 15-24) (modeled ILO estimate)" },
  { code = "SL.TLF.CACT.ZS", label = "Labor force participation rate, total (% of total population ages 15+) (modeled ILO estimate)" },
  { code = "SL.EMP.TOTL.SP.ZS", label = "Employment to population ratio, 15+, total (%) (modeled ILO estimate)" },
  { code = "SL.TLF.TOTL.IN", label = "Labor force, total" },
  { code = "SP.POP.TOTL", label = "Population, total" },
  { code = "SP.POP.GROW", label = "Population growth (annual %)" },
  { code = "SP.URB.TOTL.IN.ZS", label = "Urban population (% of total population)" },
  { code = "SP.POP.65UP.TO.ZS", label = "Population ages 65 and above (% of total population)" },
  { code = "SP.DYN.LE00.IN", label = "Life expectancy at birth, total (years)" },
  { code = "SP.DYN.TFRT.IN", label = "Fertility rate, total (births per woman)" },
  { code = "GC.DOD.TOTL.GD.ZS", label = "Central government debt, total (% of GDP)" },
  { code = "GC.REV.XGRT.GD.ZS", label = "Revenue, excluding grants (% of GDP)" },
  { code = "GC.XPN.TOTL.GD.ZS", label = "Expense (% of GDP)" },
  { code = "GC.NLD.TOTL.GD.ZS", label = "Net lending (+) / net borrowing (-) (% of GDP)" },
  { code = "GC.TAX.TOTL.GD.ZS", label = "Tax revenue (% of GDP)" },
  { code = "DT.DOD.DECT.CD", label = "External debt stocks, total (DOD, current US$)" },
  { code = "BN.CAB.XOKA.CD", label = "Current account balance (BoP, current US$)" },
  { code = "BN.CAB.XOKA.GD.ZS", label = "Current account balance (% of GDP)" },
  { code = "NE.TRD.GNFS.ZS", label = "Trade (% of GDP)" },
  { code = "NE.EXP.GNFS.ZS", label = "Exports of goods and services (% of GDP)" },
  { code = "NE.IMP.GNFS.ZS", label = "Imports of goods and services (% of GDP)" },
  { code = "BX.KLT.DINV.WD.GD.ZS", label = "Foreign direct investment, net inflows (% of GDP)" },
  { code = "BX.TRF.PWKR.DT.GD.ZS", label = "Personal remittances, received (% of GDP)" },
  { code = "FI.RES.TOTL.CD", label = "Total reserves (includes gold, current US$)" },
  { code = "FR.INR.RINR", label = "Real interest rate (%)" },
  { code = "FR.INR.LEND", label = "Lending interest rate (%)" },
  { code = "FS.AST.PRVT.GD.ZS", label = "Domestic credit to private sector (% of GDP)" },
  { code = "FM.LBL.BMNY.GD.ZS", label = "Broad money (% of GDP)" },
  { code = "SI.POV.GINI", label = "Gini index" },
  { code = "SI.POV.DDAY", label = "Poverty headcount ratio at the international poverty line (% of population)" },
]

# The `key` of econ-graph-core's countries.csv: ISO 3166-1 alpha-3 for countries, the World Bank
# code for aggregates (WLD, EMU, EUU, income groups).
[[dataset.dimensions]]
name = "area"
label = "Country or area"
codelist = "countries"

# The API's obs_status and decimal fields, declared so the schema is ready; train 1 has no
# attribute column on data_points, so the adapter does not write per-observation values for
# them (nearly every WDI row has an empty obs_status anyway).
[[dataset.attributes]]
name = "obs_status"
label = "Observation status"

[[dataset.attributes]]
name = "decimal"
label = "Decimal places"
type = "integer"
