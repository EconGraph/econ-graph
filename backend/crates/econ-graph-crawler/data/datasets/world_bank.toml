# World Bank dataset definitions. See README.md in this directory.
#
# The indicator codes below must match data/wdi_indicators.csv, which the adapter crawls and
# which carries each indicator's unit (a test checks the two agree). Each series stores its
# indicator's unit in `units`; the code list here carries labels only.

[[dataset]]
code = "wdi"
name = "World Development Indicators"
description = "World Bank development indicators, one series per indicator and country or aggregate"

# Canonical ids: wdi/{indicator}.{area}, for example wdi/NY.GDP.PCAP.CD.USA
[[dataset.dimensions]]
name = "indicator"
label = "Indicator"

[dataset.dimensions.codes]
"NY.GDP.MKTP.CD" = "GDP (current US$)"
"NY.GDP.MKTP.KD" = "GDP (constant 2015 US$)"
"NY.GDP.MKTP.KD.ZG" = "GDP growth (annual %)"
"NY.GDP.MKTP.PP.CD" = "GDP, PPP (current international $)"
"NY.GDP.PCAP.CD" = "GDP per capita (current US$)"
"NY.GDP.PCAP.KD" = "GDP per capita (constant 2015 US$)"
"NY.GDP.PCAP.KD.ZG" = "GDP per capita growth (annual %)"
"NY.GDP.PCAP.PP.CD" = "GDP per capita, PPP (current international $)"
"NY.GNP.PCAP.CD" = "GNI per capita, Atlas method (current US$)"
"NY.GDP.DEFL.KD.ZG" = "Inflation, GDP deflator (annual %)"
"NE.CON.PRVT.ZS" = "Households and NPISHs final consumption expenditure (% of GDP)"
"NE.CON.GOVT.ZS" = "General government final consumption expenditure (% of GDP)"
"NE.GDI.TOTL.ZS" = "Gross capital formation (% of GDP)"
"NY.GNS.ICTR.ZS" = "Gross savings (% of GDP)"
"NV.AGR.TOTL.ZS" = "Agriculture, forestry, and fishing, value added (% of GDP)"
"NV.IND.TOTL.ZS" = "Industry (including construction), value added (% of GDP)"
"NV.IND.MANF.ZS" = "Manufacturing, value added (% of GDP)"
"NV.SRV.TOTL.ZS" = "Services, value added (% of GDP)"
"FP.CPI.TOTL" = "Consumer price index (2010 = 100)"
"FP.CPI.TOTL.ZG" = "Inflation, consumer prices (annual %)"
"PA.NUS.FCRF" = "Official exchange rate (LCU per US$, period average)"
"PA.NUS.PPP" = "PPP conversion factor, GDP (LCU per international $)"
"SL.UEM.TOTL.ZS" = "Unemployment, total (% of total labor force) (modeled ILO estimate)"
"SL.UEM.1524.ZS" = "Unemployment, youth total (% of total labor force ages 15-24) (modeled ILO estimate)"
"SL.TLF.CACT.ZS" = "Labor force participation rate, total (% of total population ages 15+) (modeled ILO estimate)"
"SL.EMP.TOTL.SP.ZS" = "Employment to population ratio, 15+, total (%) (modeled ILO estimate)"
"SL.TLF.TOTL.IN" = "Labor force, total"
"SP.POP.TOTL" = "Population, total"
"SP.POP.GROW" = "Population growth (annual %)"
"SP.URB.TOTL.IN.ZS" = "Urban population (% of total population)"
"SP.POP.65UP.TO.ZS" = "Population ages 65 and above (% of total population)"
"SP.DYN.LE00.IN" = "Life expectancy at birth, total (years)"
"SP.DYN.TFRT.IN" = "Fertility rate, total (births per woman)"
"GC.DOD.TOTL.GD.ZS" = "Central government debt, total (% of GDP)"
"GC.REV.XGRT.GD.ZS" = "Revenue, excluding grants (% of GDP)"
"GC.XPN.TOTL.GD.ZS" = "Expense (% of GDP)"
"GC.NLD.TOTL.GD.ZS" = "Net lending (+) / net borrowing (-) (% of GDP)"
"GC.TAX.TOTL.GD.ZS" = "Tax revenue (% of GDP)"
"DT.DOD.DECT.CD" = "External debt stocks, total (DOD, current US$)"
"BN.CAB.XOKA.CD" = "Current account balance (BoP, current US$)"
"BN.CAB.XOKA.GD.ZS" = "Current account balance (% of GDP)"
"NE.TRD.GNFS.ZS" = "Trade (% of GDP)"
"NE.EXP.GNFS.ZS" = "Exports of goods and services (% of GDP)"
"NE.IMP.GNFS.ZS" = "Imports of goods and services (% of GDP)"
"BX.KLT.DINV.WD.GD.ZS" = "Foreign direct investment, net inflows (% of GDP)"
"BX.TRF.PWKR.DT.GD.ZS" = "Personal remittances, received (% of GDP)"
"FI.RES.TOTL.CD" = "Total reserves (includes gold, current US$)"
"FR.INR.RINR" = "Real interest rate (%)"
"FR.INR.LEND" = "Lending interest rate (%)"
"FS.AST.PRVT.GD.ZS" = "Domestic credit to private sector (% of GDP)"
"FM.LBL.BMNY.GD.ZS" = "Broad money (% of GDP)"
"SI.POV.GINI" = "Gini index"
"SI.POV.DDAY" = "Poverty headcount ratio at the international poverty line (% of population)"

# The `key` of econ-graph-core's countries.csv: ISO 3166-1 alpha-3 for countries, the World Bank
# code for aggregates (WLD, EMU, EUU, income groups).
[[dataset.dimensions]]
name = "area"
label = "Country or area"
codelist = "countries"

# The API's obs_status and decimal fields, declared so the schema is ready; train 1 has no
# attribute column on data_points, so the adapter does not write per-observation values for
# them (nearly every WDI row has an empty obs_status anyway).
[[dataset.attributes]]
name = "obs_status"
label = "Observation status"

[[dataset.attributes]]
name = "decimal"
label = "Decimal places"
type = "integer"
