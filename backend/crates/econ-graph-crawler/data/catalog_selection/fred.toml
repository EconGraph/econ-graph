# DRAFT — NOT READY TO DEPLOY. Full 33-family coverage proposal for #722.
# See docs/data-sources/fred-coverage.md and the coverage-family-witnesses.json fixture.
# Public evidence verifies selected ownership/examples, not complete API membership or cost.
# Rules are ORed; fields within each rule are ANDed. id_pattern matches the whole identifier.
# Stable rule keys below are comments only: the parser rejects unknown key/name fields.
# A grouped walk counts each catalog once and evaluates every predicate on each row.
#
# DELIBERATE BLOCKING PLACEHOLDERS, inherited from the GDP-only configuration:
# 500 selected series CANNOT fulfill the historical 1,533-ID target. Neither value is an
# accepted operating budget. Keep the full proposed scope; measure it with the API, then
# replace these limits with reviewed bounds that fit the user goal. Do not drop families
# merely to fit these guards. Parsing/fixture success does not establish deploy readiness.
max_catalog_series = 20000
max_series = 500
# Preserve existing headline compatibility and two known-retired probes. Financial/activity
# indices (family 09), two nowcast headlines and the world GDP aggregate are small explicit
# exceptions; the primary coverage of the other families comes from automatic rules.
include = [
    "CPIAUCSL",
    "UNRATE",
    "USREC",
    "PAYEMS",
    "FEDFUNDS",
    "DGS10",
    "INDPRO",
    "HOUST",
    "M2SL",
    "WPU00000000",
    "CAPUTLG2211S1",
    "STLFSI4",
    "NFCI",
    "ANFCI",
    "NFCIRISK",
    "NFCICREDIT",
    "NFCILEVERAGE",
    "NFCINONFINLEVERAGE",
    "KCFSI",
    "CFNAI",
    "CFNAIMA3",
    "CFNAIDIFF",
    "WEI",
    "RECPROUSM156N",
    "SAHMREALTIME",
    "SAHMCURRENT",
    "JHGDPBRINDX",
    "GDPNOW",
    "STLENI",
    "NYGDPMKTPCDWLD",
]
expected_missing = ["WPU00000000", "CAPUTLG2211S1"]
exclude = []

