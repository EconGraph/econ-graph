# Match BEA's current table names; the prefixes follow families through suffix renames.
# Expansion beyond these bounds stops the discovery rather than silently truncating it.
max_tables = 32
max_series = 20000
# SAGDP2S is the discontinued SIC-basis GDP by state (1963-1997); its industry lines do not
# match the NAICS tables the SAGDP2 prefix is meant to follow (SAGDP2, and SAGDP2N while BEA
# listed the table under that name).
exclude = ["SAGDP2S"]

[[rule]]
dataset = "NIPA"
prefix = "T10101"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10105"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10106"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T20100"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T20600"
frequencies = ["M"]

[[rule]]
dataset = "NIPA"
prefix = "T20804"
frequencies = ["M"]

[[rule]]
dataset = "Regional"
prefix = "SAGDP2"
frequencies = ["A"]
