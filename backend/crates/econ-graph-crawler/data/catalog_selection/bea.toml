# Match BEA's current table names; the prefixes follow families through suffix renames.
# Expansion beyond these bounds stops the discovery rather than silently truncating it.
# Each rule selects one table. Neighbouring tables that a prefix also matches (SAINC1 also
# matches SAINC11 and SAINC12) are listed in `exclude`.
max_tables = 32
max_series = 20000
exclude = ["SAINC11", "SAINC12"]

# NIPA Section 1: domestic product and income.
[[rule]]
dataset = "NIPA"
prefix = "T10101"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10104"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10105"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10106"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10107"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T10109"
frequencies = ["A", "Q"]

[[rule]]
dataset = "NIPA"
prefix = "T11000"
frequencies = ["A", "Q"]

