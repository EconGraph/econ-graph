[package]
name = "econ-graph-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crawler"
path = "src/bin/crawler.rs"

# Loads recorded fixtures through the adapters into a database (release e2e stack); no network.
[[bin]]
name = "seed-fixtures"
path = "src/bin/seed_fixtures.rs"
required-features = ["testkit"]

[dependencies]
# Core dependencies
econ-graph-core = { path = "../econ-graph-core" }

# HTTP client for crawling
reqwest.workspace = true

# Async runtime
tokio.workspace = true

# CLI argument parsing (`env` lets the worker binary read CRAWLER_* variables)
clap = { workspace = true, features = ["env"] }

# URL parsing
url.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
# Dataset definitions (data/datasets/*.toml)
toml.workspace = true
# FHFA HPI master file
csv.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Date/Time
chrono.workspace = true

# UUID
uuid.workspace = true

# Adapter trait and data types
async-trait.workspace = true
bigdecimal.workspace = true

# Shared HTTP layer: metrics, Retry-After HTTP-date parsing, backoff jitter
econ-graph-metrics = { path = "../econ-graph-metrics" }
httpdate = "1"
rand.workspace = true

# Persistence (src/persist.rs) and queue worker (src/worker.rs)
diesel.workspace = true
diesel-async.workspace = true
futures.workspace = true

# Adapter contract test kit (feature `testkit`)
wiremock = { workspace = true, optional = true }

[features]
# Adapter contract test kit: mock upstream server, test CrawlCtx, contract assertions.
# In-crate tests get it automatically via cfg(test); other crates enable it as a dev-dependency feature.
testkit = ["dep:wiremock"]
# Registers the ten static-catalog adapters (BOC, BOE, BOJ, ECB, ILO, OECD, RBA, SNB, UN_STATS,
# WTO) in `default_registry()`. Development only: their series lists are hardcoded and they
# can't fetch data, so release builds leave this off. See `src/sources/static_catalogs.rs`.
static-catalogs = []

[dev-dependencies]
wiremock.workspace = true
diesel-async.workspace = true
# Paused (virtual) time for the rate limiter tests
tokio = { workspace = true, features = ["test-util"] }
