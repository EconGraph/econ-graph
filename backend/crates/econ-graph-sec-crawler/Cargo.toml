[package]
name = "econ-graph-sec-crawler"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Unfinished XBRL parser, DTS (taxonomy) download, financial ratio calculator and the
# config/*.json they load. Off by default so the live crawl only stores filings; the XBRL
# parser work later builds on it.
xbrl-parser = ["dep:quick-xml", "dep:xml", "dep:regex", "dep:md5", "econ-graph-core/financial-ratios"]

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
bigdecimal.workspace = true
url.workspace = true
futures.workspace = true
async-trait.workspace = true
once_cell.workspace = true

# HTTP and networking
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
tokio-util = { version = "0.7", features = ["io"] }

# Configuration
config.workspace = true
dotenvy.workspace = true

# Validation
validator.workspace = true

# CSV parsing
csv.workspace = true

# Scheduling
tokio-cron-scheduler.workspace = true

# CLI
clap.workspace = true

# Random
rand.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# File system operations
walkdir = "2.5"

# XML parsing for XBRL
quick-xml = { version = "0.42", optional = true }
xml = { version = "1.4", optional = true }

# Database
diesel = { version = "2.3", features = ["postgres", "chrono", "uuid", "numeric"] }
diesel-async = { version = "=0.9.2", features = ["postgres", "bb8"] }

# Regular expressions
regex = { version = "1.13", optional = true }

# Retry logic
backoff = "0.4"

# Progress tracking
indicatif = "0.18"

# Compression
zstd = "0.14"

# Hashing for file integrity
sha2.workspace = true
hex = "0.4"
md5 = { version = "0.8", optional = true }

# Local dependencies
econ-graph-core = { path = "../econ-graph-core" }
econ-graph-metrics = { path = "../econ-graph-metrics" }
# Shared HTTP layer (HttpFetcher, SEC policy) and crawl_queue worker integration
econ-graph-crawler = { path = "../econ-graph-crawler" }

[dev-dependencies]
econ-graph-crawler = { path = "../econ-graph-crawler", features = ["testkit"] }
# Testing
tokio-test.workspace = true
mockito.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
serial_test.workspace = true

# Test utilities
assert_matches = "1.5"
rstest = "0.27"
rstest_reuse = "0.7"

[[test]]
name = "xbrl_financial_integration_tests"
required-features = ["xbrl-parser"]

[[bin]]
name = "sec-crawler"
path = "src/bin/sec_crawler.rs"

[[bin]]
name = "sec-company-crawler"
path = "src/bin/sec_company_crawler.rs"
