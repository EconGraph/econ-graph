[package]
name = "econ-graph-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core dependency
econ-graph-core = { path = "../econ-graph-core" }

# Authentication and security
jsonwebtoken.workspace = true

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Web framework (the `testkit` feature's local OIDC provider)
warp = { workspace = true, optional = true }

# Date/Time
chrono.workspace = true

# UUID
uuid.workspace = true

# HTTP client
reqwest.workspace = true

# Test identity provider (the `testkit` feature)
aws-lc-rs = { version = "1.15", optional = true }
base64 = { version = "0.22", optional = true }

[features]
# `econ_graph_auth::testkit`: a local OIDC provider that serves a JWKS and mints tokens.
testkit = ["dep:aws-lc-rs", "dep:base64", "dep:warp"]

# Test dependencies
[dev-dependencies]
aws-lc-rs = "1.15"
base64 = "0.22"
warp.workspace = true
diesel-async.workspace = true
serial_test.workspace = true
tokio-test.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
