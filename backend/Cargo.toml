[workspace]
members = [
    "crates/econ-graph-core",
    "crates/econ-graph-services",
    "crates/econ-graph-auth",
    "crates/econ-graph-graphql",
    "crates/econ-graph-crawler",
    "crates/econ-graph-sec-crawler",
    "crates/econ-graph-mcp",
    "crates/econ-graph-backend",
    "crates/econ-graph-metrics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MS-PL"

[workspace.dependencies]
# Common dependencies shared across crates
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
bigdecimal = { version = "=0.4.10", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
url = "2.5"
futures = { version = "0.3.34", features = ["std"] }
async-trait = "0.1"
once_cell = "1.21"

# Database
diesel = { version = "=2.3.13", features = ["postgres", "chrono", "uuid", "numeric", "serde_json"] }
diesel-async = { version = "=0.9.2", features = ["postgres", "bb8"] }
bb8 = "=0.9.1"
diesel_migrations = "=2.3.2"

# HTTP and networking
reqwest = { version = "=0.13.5", features = ["json", "stream"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Validation
validator = { version = "0.21", features = ["derive"] }
regex = "1.13"

# CSV parsing
csv = "1.4"

# Authentication
bcrypt = "0.19"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
oauth2 = "5.0"

# Scheduling
tokio-cron-scheduler = "0.15"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Random
rand = "0.10"

# Hashing
sha2 = "0.11"

# Metrics
prometheus = "0.14"
sysinfo = "0.39"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2"

# Web framework
warp = "0.3"
tokio-stream = "0.1"

# GraphQL
async-graphql = { version = "7.2", features = ["chrono", "uuid", "bigdecimal"] }
async-graphql-warp = "7.2"
dataloader = { version = "0.18", default-features = false, features = ["runtime-tokio"] }

# Testing
tokio-test = "0.4"
mockito = "1.7"
tempfile = "3.27"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
serial_test = "4.0"
rust_decimal_macros = "1.40.0"
imara-diff = "0.2"
