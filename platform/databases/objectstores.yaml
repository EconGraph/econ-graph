apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: app-backups
  namespace: econ-graph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  configuration:
    destinationPath: s3://econgraph-${ENVIRONMENT}-app-backups
    endpointURL: ${OBJECT_STORE_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: app-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: app-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
---
