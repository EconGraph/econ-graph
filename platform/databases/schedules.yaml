apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: econgraph-app
  namespace: econ-graph
spec:
  schedule: 0 0 * * * *
  backupOwnerReference: none
  cluster:
    name: econgraph-app
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: econgraph-data
  namespace: econ-graph
spec:
  schedule: 0 0 */6 * * *
  backupOwnerReference: none
  cluster:
    name: econgraph-data
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: econgraph-keycloak
  namespace: econ-graph
spec:
  schedule: 0 30 * * * *
  backupOwnerReference: none
  cluster:
    name: econgraph-keycloak
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
