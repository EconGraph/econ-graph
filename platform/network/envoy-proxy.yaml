apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: econ-graph-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: econ-graph-gateway-proxy
        type: LoadBalancer
      envoyDeployment:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 1
        # Envoy Gateway v1.9.3's default proxy image (distroless-v1.39.5) still trusts the
        # compromised eMudhra intermediate CAs; distroless-v1.39.6 removes them. This
        # EnvoyProxy replaces the controller's default, so the image is set here. Drop the
        # override once the pinned Envoy Gateway release defaults to 1.39.6 or later.
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.6@sha256:1cac8b3a2f72d5a0918f54d7b49e68aae0b0ba325c2d50c8a9a3fff7a4d1f994
        pod:
          nodeSelector:
            econgraph.io/storage: postgres
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    gateway.envoyproxy.io/owning-gateway-name: econ-graph-gateway
                topologyKey: kubernetes.io/hostname
