apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: monitoring
  targetNamespace: monitoring
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.16.1
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      reconcileStrategy: ChartVersion
  values:
    # Cilium replaces kube-proxy (addons/cilium kubeProxyReplacement), so there is no
    # kube-proxy to scrape and the chart's KubeProxyDown alert would always fire.
    kubeProxy:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: econgraph-local
        size: 5Gi
      # Dashboards in platform/observability reference uid prometheus (chart default
      # grafana.sidecar.datasources.uid) and uid loki (below).
      additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
    prometheus:
      prometheusSpec:
        replicas: 2
        retention: 30d
        # Size-based retention fires before the 10Gi volume fills (TSDB + WAL overhead).
        retentionSize: 8GB
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: econgraph-local
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
