apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: monitoring
  targetNamespace: monitoring
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.16.1
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      reconcileStrategy: ChartVersion
  values:
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: econgraph-local
        size: 5Gi
    prometheus:
      prometheusSpec:
        replicas: 2
        retention: 30d
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: econgraph-local
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
