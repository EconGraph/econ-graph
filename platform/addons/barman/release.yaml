apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman
  namespace: flux-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: barman
  targetNamespace: cnpg-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      reconcileStrategy: ChartVersion
  values:
    replicaCount: 2
    image:
      tag: v0.15.1
