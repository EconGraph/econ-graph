apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: loki
  targetNamespace: monitoring
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: loki
      version: 7.5.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      reconcileStrategy: ChartVersion
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 2
      schemaConfig:
        configs:
        - from: '2026-01-01'
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: econgraph-${ENVIRONMENT}-logs
          ruler: econgraph-${ENVIRONMENT}-log-rules
          admin: econgraph-${ENVIRONMENT}-log-admin
        s3:
          endpoint: ${OBJECT_STORE_HOSTPORT}
          region: us-east-1
          s3ForcePathStyle: true
          insecure: false
      compactor:
        retention_enabled: false
    global:
      extraEnvFrom:
      - secretRef:
          name: loki-objectstore
    singleBinary:
      replicas: 2
      persistence:
        enabled: true
        storageClass: econgraph-local
        size: 10Gi
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
