apiVersion: batch/v1
kind: Job
metadata:
  name: crawler-migrate
  namespace: econ-graph
  labels:
    app: crawler-migrate
    component: crawler
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: crawler-migrate
        component: crawler
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.38
        command:
        - sh
        - -c
        args:
        - "echo \"Waiting for PostgreSQL to be ready...\"\nuntil nc -z data-postgres-service\
          \ 5432; do\n  echo \"PostgreSQL is unavailable - sleeping\"\n  sleep 2\n\
          done\necho \"PostgreSQL is ready!\"\n"
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 32Mi
            cpu: 50m
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: crawler-migrate
        image: ${CRAWLER_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /app/crawler
        - migrate
        env:
        - name: DATA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: econ-graph-secrets
              key: data-database-url
        - name: RUST_LOG
          value: info
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
