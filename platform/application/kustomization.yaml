apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../k8s/base
- ../../config/keycloak
- ../../scripts/keycloak
- data-service.yaml
- disruption-budgets.yaml
- network-policies.yaml
- crawler.yaml
- api-egress.yaml
namespace: econ-graph
patches:
- target:
    kind: StatefulSet
    name: app-postgres
  patch: "apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: app-postgres\n\
    $patch: delete\n"
- target:
    kind: StatefulSet
    name: keycloak-postgres
  patch: "apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: keycloak-postgres\n\
    $patch: delete\n"
- target:
    kind: Service
    name: app-postgres-service
  patch: "apiVersion: v1\nkind: Service\nmetadata:\n  name: app-postgres-service\n\
    $patch: delete\n"
- target:
    kind: Service
    name: keycloak-postgres-service
  patch: "apiVersion: v1\nkind: Service\nmetadata:\n  name: keycloak-postgres-service\n\
    $patch: delete\n"
- target:
    kind: ConfigMap
    name: app-postgresql-init
  patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-postgresql-init\n\
    $patch: delete\n"
- target:
    kind: Deployment
    name: econ-graph-backend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: econ-graph-backend\n\
    spec:\n  replicas: 2\n  template:\n    spec:\n      automountServiceAccountToken:\
    \ false\n      nodeSelector:\n        econgraph.io/storage: postgres\n      affinity:\n\
    \        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \          - labelSelector:\n              matchLabels:\n                app:\
    \ econ-graph-backend\n            topologyKey: kubernetes.io/hostname\n      initContainers:\n\
    \      - name: wait-for-postgres\n        args:\n        - until nc -z app-postgres-service\
    \ 5432; do sleep 2; done\n"
- target:
    kind: Deployment
    name: econ-graph-data-backend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: econ-graph-data-backend\n\
    spec:\n  replicas: 2\n  template:\n    spec:\n      automountServiceAccountToken:\
    \ false\n      nodeSelector:\n        econgraph.io/storage: postgres\n      affinity:\n\
    \        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \          - labelSelector:\n              matchLabels:\n                app:\
    \ econ-graph-data-backend\n            topologyKey: kubernetes.io/hostname\n"
- target:
    kind: Deployment
    name: econ-graph-frontend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: econ-graph-frontend\n\
    spec:\n  replicas: 2\n  template:\n    spec:\n      automountServiceAccountToken:\
    \ false\n      nodeSelector:\n        econgraph.io/storage: postgres\n      affinity:\n\
    \        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \          - labelSelector:\n              matchLabels:\n                app:\
    \ econ-graph-frontend\n            topologyKey: kubernetes.io/hostname\n"
- target:
    kind: Deployment
    name: keycloak
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: keycloak\nspec:\n\
    \  replicas: 2\n  template:\n    spec:\n      automountServiceAccountToken: false\n\
    \      nodeSelector:\n        econgraph.io/storage: postgres\n      affinity:\n\
    \        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \          - labelSelector:\n              matchLabels:\n                app:\
    \ keycloak\n            topologyKey: kubernetes.io/hostname\n"
- target:
    kind: Job
    name: keycloak-realm-import
  patch: "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: keycloak-realm-import\n\
    spec:\n  template:\n    spec:\n      volumes:\n      - name: realm-scripts\n \
    \       configMap:\n          name: keycloak-realm-scripts\n      initContainers:\n\
    \      - name: render-realm\n        args:\n        - 'set -euo pipefail\n\n \
    \         if [ -n \"$${KC_GOOGLE_CLIENT_ID:-}\" ] && [ -n \"$${KC_GOOGLE_CLIENT_SECRET:-}\"\
    \n          ]; then export KC_GOOGLE_ENABLED=true; fi\n\n          if [ -n \"\
    $${KC_FACEBOOK_CLIENT_ID:-}\" ] && [ -n \"$${KC_FACEBOOK_CLIENT_SECRET:-}\"\n\
    \          ]; then export KC_FACEBOOK_ENABLED=true; fi\n\n          python /scripts/independent-data-realm.py\
    \ /config/econ-graph-realm.json\n          > /rendered/independent-template.json\n\
    \n          bash /scripts/render-realm.sh /rendered/independent-template.json\
    \ > /rendered/realm-template.json\n\n          python /scripts/preserve-catalog-grants.py\
    \ /rendered/realm-template.json\n          > /rendered/econ-graph-realm.json\n\
    \n          '\n        volumeMounts:\n        - name: realm-scripts\n        \
    \  mountPath: /scripts\n          readOnly: true\n        env:\n        - name:\
    \ KC_WEB_BASE_URL\n          value: ${PUBLIC_ORIGIN}\n        - name: KC_ADMIN_BASE_URL\n\
    \          value: ${PUBLIC_ORIGIN}\n      containers:\n      - name: finalize-catalog-policy\n\
    \        command:\n        - python\n        - /scripts/preserve-catalog-grants.py\n\
    \        - --complete\n        - /rendered/econ-graph-realm.json\n        volumeMounts:\n\
    \        - name: realm-scripts\n          mountPath: /scripts\n          readOnly:\
    \ true\n"
- target:
    kind: Deployment
    name: econ-graph-backend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: econ-graph-backend\n\
    spec:\n  template:\n    spec:\n      containers:\n      - name: backend\n    \
    \    env:\n        - name: OIDC_ISSUER\n          value: ${PUBLIC_ORIGIN}/idp/realms/econ-graph\n"
- target:
    kind: Deployment
    name: keycloak
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: keycloak\nspec:\n\
    \  template:\n    spec:\n      containers:\n      - name: keycloak\n        env:\n\
    \        - name: KC_HOSTNAME\n          value: ${PUBLIC_ORIGIN}/idp\n        -\
    \ name: KC_HOSTNAME_ADMIN\n          value: ${PUBLIC_ORIGIN}/idp\n        - name:\
    \ KC_WEB_BASE_URL\n          value: ${PUBLIC_ORIGIN}\n        - name: KC_ADMIN_BASE_URL\n\
    \          value: ${PUBLIC_ORIGIN}\n"
- target:
    kind: HTTPRoute
  patch: "- op: replace\n  path: /spec/hostnames/0\n  value: ${PUBLIC_HOST}\n"
- target:
    kind: ConfigMap
    name: econ-graph-config
  patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: econ-graph-config\n\
    data:\n  CORS_ORIGIN: ${PUBLIC_ORIGIN}\n  REACT_APP_API_URL: ${PUBLIC_ORIGIN}\n\
    \  REACT_APP_WS_URL: ${PUBLIC_WS_ORIGIN}/graphql\n  REACT_APP_ADMIN_API_URL: ${PUBLIC_ORIGIN}\n\
    \  REACT_APP_ADMIN_WS_URL: ${PUBLIC_WS_ORIGIN}/graphql\n"
- target:
    kind: Deployment
    name: keycloak
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: keycloak\nspec:\n\
    \  template:\n    spec:\n      containers:\n      - name: keycloak\n        args:\n\
    \        - 'if [ -n \"$${KC_GOOGLE_CLIENT_ID:-}\" ] && [ -n \"$${KC_GOOGLE_CLIENT_SECRET:-}\"\
    \n          ]; then export KC_GOOGLE_ENABLED=true; fi\n\n          if [ -n \"\
    $${KC_FACEBOOK_CLIENT_ID:-}\" ] && [ -n \"$${KC_FACEBOOK_CLIENT_SECRET:-}\"\n\
    \          ]; then export KC_FACEBOOK_ENABLED=true; fi\n\n          exec /opt/keycloak/bin/kc.sh\
    \ start\n\n          '\n        env:\n        - name: KC_CACHE\n          value:\
    \ ispn\n        - name: KC_CACHE_STACK\n          value: jdbc-ping\n        -\
    \ name: KC_WEB_E2E_BASE_URL\n          value: ${PUBLIC_ORIGIN}\n"
- target:
    kind: Deployment
    name: econ-graph-backend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: econ-graph-backend\n\
    spec:\n  template:\n    spec:\n      containers:\n      - name: backend\n    \
    \    image: ${BACKEND_IMAGE}\n        imagePullPolicy: IfNotPresent\n"
- target:
    kind: Deployment
    name: econ-graph-frontend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: econ-graph-frontend\n\
    spec:\n  template:\n    spec:\n      containers:\n      - name: frontend\n   \
    \     image: ${FRONTEND_IMAGE}\n        imagePullPolicy: IfNotPresent\n"
