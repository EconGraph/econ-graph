      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-app
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: econgraph-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - &id001
      podSelector:
        matchLabels:
          cnpg.io/cluster: econgraph-app
    - podSelector:
        matchLabels:
          app: econ-graph-backend
    - podSelector:
        matchLabels:
          app: econ-graph-data-backend
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - port: 5432
      protocol: TCP
    - port: 8000
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9187
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - *id001
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - ipBlock:
        cidr: ${OBJECT_STORE_CIDR}
    ports:
    - port: ${OBJECT_STORE_PORT}
      protocol: TCP
---
