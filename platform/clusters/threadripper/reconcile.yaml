apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-network
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/network
  sourceRef:
    kind: GitRepository
    name: econgraph-platform
  prune: false
  deletionPolicy: Orphan
  wait: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: platform-settings
  dependsOn:
  - name: platform-cilium
  - name: platform-envoy
  healthChecks:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: econ-graph-gateway
    namespace: econ-graph-gateway
  healthCheckExprs:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Programmed'
      && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/secrets
  sourceRef:
    kind: GitRepository
    name: econgraph-platform
  prune: false
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: platform-settings
  dependsOn:
  - name: platform-sources
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-databases
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/databases
  sourceRef:
    kind: GitRepository
    name: econgraph-platform
  prune: false
  deletionPolicy: Orphan
  wait: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: platform-settings
  dependsOn:
  - name: platform-barman
  - name: platform-storage
  - name: platform-secrets
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: econgraph-app
    namespace: econ-graph
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: econgraph-data
    namespace: econ-graph
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: econgraph-keycloak
    namespace: econ-graph
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    inProgress: '!has(status.readyInstances) || status.readyInstances < spec.instances'
    current: has(status.readyInstances) && status.readyInstances == spec.instances
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-data-schema
  namespace: flux-system
