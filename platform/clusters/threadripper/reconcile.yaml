apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/sources
  sourceRef:
    kind: GitRepository
    name: econgraph-platform
  prune: false
  deletionPolicy: Orphan
  wait: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: platform-settings
---
