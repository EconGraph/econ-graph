apiVersion: v1
kind: ConfigMap
metadata:
  name: econgraph-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  econgraph-platform.json: "{\n  \"uid\": \"econgraph-platform\",\n  \"title\": \"\
    EconGraph platform recovery\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n\
    \  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\"\
    : \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\"\
    : \"DS_PROMETHEUS\",\n        \"type\": \"datasource\",\n        \"query\": \"\
    prometheus\"\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n\
    \      \"title\": \"CNPG pod readiness\",\n      \"type\": \"timeseries\",\n \
    \     \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n\
    \        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"targets\": [\n   \
    \     {\n          \"expr\": \"kube_pod_status_ready{namespace=\\\"econ-graph\\\
    \",condition=\\\"true\\\",pod=~\\\"econgraph-(app|data|keycloak)-[0-9]+\\\"}\"\
    ,\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\"\
    : 2,\n      \"title\": \"Seconds since successful backup check\",\n      \"type\"\
    : \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n\
    \        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n   \
    \     \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n     \
    \ },\n      \"targets\": [\n        {\n          \"expr\": \"time() - kube_cronjob_status_last_successful_time{namespace=\\\
    \"econ-graph\\\",cronjob=\\\"cnpg-backup-health\\\"}\",\n          \"refId\":\
    \ \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\"\
    : \"CNPG volume available bytes\",\n      \"type\": \"timeseries\",\n      \"\
    gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n     \
    \   \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"${DS_PROMETHEUS}\"\n      },\n      \"targets\": [\n   \
    \     {\n          \"expr\": \"kubelet_volume_stats_available_bytes{namespace=\\\
    \"econ-graph\\\"}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n\
    \    {\n      \"id\": 4,\n      \"title\": \"Pending pods\",\n      \"type\":\
    \ \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n\
    \        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n   \
    \     \"type\": \"prometheus\",\n        \"uid\": \"${DS_PROMETHEUS}\"\n     \
    \ },\n      \"targets\": [\n        {\n          \"expr\": \"kube_pod_status_phase{namespace=\\\
    \"econ-graph\\\",phase=\\\"Pending\\\"}\",\n          \"refId\": \"A\"\n     \
    \   }\n      ]\n    }\n  ]\n}"
