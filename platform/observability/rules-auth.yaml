# Anonymous catalog grant alerts on the platform: the kind-era
# k8s/monitoring/prometheus-rules-auth.yaml (kept for kind) ported to a PrometheusRule the
# kube-prometheus-stack Prometheus loads. Metric meanings are documented there.
#
# The backend's /metrics is scraped by the ServiceMonitor econgraph-backends (monitors.yaml),
# which adds namespace, service, pod, container, endpoint, instance and job (the Service name,
# econ-graph-backend-service). The expressions match no scrape labels, so they are unchanged;
# each alert carries the pod (and the rest) of the backend it is about.
#
# Flux substitutes ${VAR} from platform-settings in this Kustomization; the annotation below
# keeps it away from the alert templates. Tests: tests/anonymous-grants.test.yaml, run by
# check-rules.sh in CI.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: econgraph-auth
  namespace: monitoring
  labels:
    release: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  groups:
  - name: anonymous-grants
    rules:
    # Six failures in a row is Keycloak not answering the backend (or refusing its anonymous
    # client) for 60 to 90 seconds: each attempt can wait out its 5-second timeout before
    # the 10-second retry. With the 1-minute hold, the alert fires about 2 to 2.5 minutes
    # into an outage. Grants survive that only until they expire.
    - alert: AnonymousGrantRenewalFailing
      expr: anonymous_grant_renewal_consecutive_failures >= 6
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: The backend can't renew anonymous catalog grants from Keycloak
        description: A backend has failed to renew the anonymous catalog grants six or more times in a row. Once the current grants expire (and any ANONYMOUS_GRANTS_STALE_MAX_SECS window passes), anonymous visitors see no catalogs. Check the backend log for "Anonymous catalog grant renewal failed" or "Keycloak refused the anonymous catalog client", and Keycloak itself.

    # Also fires when every catalog was deliberately withdrawn from anonymous visitors; then
    # it is expected and can be silenced.
    - alert: AnonymousCatalogGrantsEmpty
      expr: anonymous_catalog_grants == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Anonymous visitors have had no catalog access for 10 minutes
        description: A backend has held no anonymous catalog grants for 10 minutes, so anonymous visitors see empty catalogs. Expected only when every catalog was withdrawn from anonymous visitors in Keycloak; otherwise see AnonymousGrantRenewalFailing and the backend log.

    - alert: AnonymousGrantRefreshStopped
      expr: anonymous_grant_refresh_task_running == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: A backend stopped renewing anonymous catalog grants
        description: The background task that renews anonymous catalog grants has ended in a backend, so its anonymous grants lapse within five minutes and are never renewed. Restart the backend (`kubectl -n econ-graph rollout restart deployment/econ-graph-backend`) and look for "refresh task" in its log.
