apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- monitors.yaml
- monitors-edge.yaml
- rules-edge.yaml
- backup-health.yaml
- dashboard.yaml
- rules-crawler.yaml
- rules-auth.yaml
- rules-tunnel.yaml
- rules-timeseries.yaml
- rules-disk.yaml
- scrape-host.yaml
- dashboard-disk.yaml
configMapGenerator:
- name: cnpg-backup-health
  namespace: econ-graph
  files:
  - backup-health.py
# Grafana sidecar dashboards. The JSON uses Grafana $variables, so Flux substitution stays off.
# Datasource uids: prometheus (chart default) and loki (grafana.additionalDataSources in
# addons/monitoring/release.yaml); scripts/platform/test_dashboards.py checks both.
- name: econgraph-crawler-dashboards
  namespace: monitoring
  files:
  - dashboards/crawler-overview.json
  - dashboards/crawler-politeness.json
  - dashboards/sec-edgar-crawler.json
  options:
    labels:
      grafana_dashboard: '1'
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
- name: econgraph-logs-dashboard
  namespace: monitoring
  files:
  - dashboards/logging-dashboard.json
  options:
    labels:
      grafana_dashboard: '1'
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
