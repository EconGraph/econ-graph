# Scrape the host's node_exporter (scripts/host/install-host-disk-exporter.sh,
# docs/deployment/HOST_DISK_MONITORING.md). HOST_EXPORTER_TARGET in
# platform-settings is the host's address on the VM bridge and the exporter
# port, e.g. 192.168.250.1:9100. The chart's Prometheus selects ScrapeConfigs
# labelled release=monitoring. The monitoring namespace has no network policy,
# so Prometheus may reach the host; the host firewall must allow the nodes.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: econgraph-host
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: econgraph-host
  scrapeInterval: 60s
  scrapeTimeout: 20s
  staticConfigs:
  - targets:
    - ${HOST_EXPORTER_TARGET}
