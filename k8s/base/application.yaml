apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-postgres
  labels:
    app: app-postgres
    version: '18'
spec:
  serviceName: app-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: app-postgres
  template:
    metadata:
      labels:
        app: app-postgres
        version: '18'
    spec:
      nodeSelector:
        econgraph.io/host-storage: 'true'
      initContainers:
      - name: init-data-dir
        image: postgres:18
        command:
        - sh
        - -ec
        - "root=\"$1\"; pgdata=\"$2\"\n# The host directory starts out owned by the\
          \ operator account. Postgres runs\n# as 999 and has to create PGDATA inside\
          \ it, so hand the volume root over.\nchown 999:999 \"$root\"\nchmod 0700\
          \ \"$root\"\n# A data directory restored by a copy that didn't keep ownership\
          \ (anything\n# but 999:999) would stop Postgres starting; fix it once.\n\
          if [ -e \"$pgdata\" ] && [ \"$(stat -c %u:%g \"$pgdata\")\" != \"999:999\"\
          \ ]; then\n  echo \"fixing ownership of $pgdata\"\n  chown -R 999:999 \"\
          $pgdata\"\nfi\nstat -c '%n %u:%g %a' \"$root\"\n"
        - init-data-dir
        - /data
        - /data/pgdata
        volumeMounts:
        - name: app-postgres-data
          mountPath: /data
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_READ_SEARCH
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: econ_graph_app
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-app-postgres
              key: postgres-password
        - name: APP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-app-postgres
              key: app-password
        - name: PGDATA
          value: /data/pgdata
        volumeMounts:
        - name: app-postgres-data
          mountPath: /data
        - name: app-postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 500m
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - econ_graph_app
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - econ_graph_app
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: app-postgres-init
        configMap:
          name: app-postgres-init
          defaultMode: 365
      securityContext:
        fsGroup: 999
  volumeClaimTemplates:
  - metadata:
      name: app-postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: econgraph-host
      volumeName: econgraph-app-prod-app-pg
      resources:
        requests:
          storage: 10Gi
