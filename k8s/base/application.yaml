              key: admin-password
        - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
          value: 'true'
        - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
          value: 600s
        - name: IMPORT_BEHAVIORS_REMOVEDEFAULTROLEFROMUSER
          value: 'true'
        - name: IMPORT_FILES_LOCATIONS
          value: /rendered/econ-graph-realm.json
        volumeMounts:
        - name: rendered
          mountPath: /rendered
          readOnly: true
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: finalize-catalog-policy
        image: python:3.15.2-slim@sha256:2145e0fc7fbd73eaae44c3c4759cf303e2c4e531353b207c6493226a02668ca5
        command:
        - python
        - /config/preserve-catalog-grants.py
        - --complete
        - /rendered/econ-graph-realm.json
        env:
        - name: KEYCLOAK_URL
          value: http://keycloak-service:8080/idp
        - name: KEYCLOAK_USER
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: admin-username
        - name: KEYCLOAK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: admin-password
        volumeMounts:
        - name: realm
          mountPath: /config
          readOnly: true
        - name: rendered
          mountPath: /rendered
          readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 250m
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      - name: rendered
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
