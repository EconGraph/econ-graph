apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # The ACME server URL (staging for testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: admin@econgraph.com
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging
    # HTTP-01 challenges answered through the gateway's http listener
    # (k8s/manifests/gateway/); cert-manager runs with --enable-gateway-api.
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: econ-graph-gateway
            namespace: econ-graph-gateway
            sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # The ACME server URL (production)
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: admin@econgraph.com
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
    # HTTP-01 challenges answered through the gateway's http listener
    # (k8s/manifests/gateway/); cert-manager runs with --enable-gateway-api.
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: econ-graph-gateway
            namespace: econ-graph-gateway
            sectionName: http
