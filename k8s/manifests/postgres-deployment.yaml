# PostgreSQL deployment for Kubernetes cluster
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: econ-graph
  labels:
    app: postgresql
    version: "18"
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        version: "18"
    spec:
      # Pinned to the kind worker that bind-mounts the host subvolumes.
      nodeSelector:
        econgraph.io/host-storage: "true"
      # The PV is a host directory (k8s/manifests/host-storage.yaml). fsGroup
      # doesn't apply to hostPath volumes, so hand the volume root to the postgres
      # user (999) here. Under rootless Docker, uid 999 in the pod is host uid
      # 100998; see docs/deployment/HOST_STORAGE.md.
      initContainers:
      - name: init-data-dir
        image: postgres:18
        command:
        - sh
        - -ec
        - |
          root="$1"; pgdata="$2"
          # The host directory starts out owned by jmalicki (uid 0 here). Postgres runs
          # as 999 and has to create PGDATA inside it, so hand the volume root over.
          chown 999:999 "$root"
          chmod 0700 "$root"
          # A data directory restored by a copy that didn't keep ownership (e.g. made
          # outside a rootless container) would stop Postgres starting; fix it once.
          if [ -e "$pgdata" ] && [ "$(stat -c %u:%g "$pgdata")" != "999:999" ]; then
            echo "fixing ownership of $pgdata"
            chown -R 999:999 "$pgdata"
          fi
          stat -c '%n %u:%g %a' "$root"
        - init-data-dir
        - /data
        - /data/pgdata
        volumeMounts:
        - name: postgresql-data
          mountPath: /data
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER", "DAC_READ_SEARCH"]
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: postgresql
        image: postgres:18
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          value: "econ_graph"
        - name: POSTGRES_USER
          value: "postgres"
        # Passwords come from the econ-graph-postgres Secret, created out of band by
        # scripts/deploy/create-secrets.sh. Both only take effect when the data
        # volume is initialised for the first time.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-postgres
              key: postgres-password
        # Read by the init script in postgres-init.yaml to create the app user.
        - name: APP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-postgres
              key: app-password
        - name: PGDATA
          value: "/data/pgdata"
        volumeMounts:
        - name: postgresql-data
          mountPath: /data
        - name: postgresql-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # PostgreSQL needs to write to /var/lib/postgresql/data
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - econ_graph
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - econ_graph
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgresql-init
        configMap:
          name: postgresql-init
          # Executable, so the entrypoint runs the init script in its own shell
          # instead of sourcing it.
          defaultMode: 0555
      securityContext:
        # Not applied to hostPath volumes; ownership is set by init-data-dir.
        fsGroup: 999
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      # Static PV on the host subvolume (k8s/manifests/host-storage.yaml).
      storageClassName: econgraph-host
      volumeName: econgraph-data-plane-pg
      resources:
        requests:
          storage: 50Gi
