# Backup and restore scripts shared by postgres-backup-cronjob.yaml and
# scripts/deploy/restore-postgres-backup.sh (which runs the restore.sh
# script below inside a one-off Job). scripts/deploy/test-postgres-backup-scripts.sh
# runs them against scratch PostgreSQL containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-scripts
  namespace: econ-graph
data:
  backup.sh: |
    #!/bin/sh
    # Dumps the data database econ_graph (PG* env), the app database
    # econ_graph_app (APP_PG* env) and Keycloak's database (KEYCLOAK_PG* env)
    # to ${BACKUP_DIR} as <name>-<UTC stamp>.dump, with one stamp per run.
    #
    # Whether there is a separate app database to dump comes from the URL the
    # backend uses for it (APP_DATABASE_URL, from app-database-url in the
    # Secret econ-graph-secrets). Only its host, port and database name are
    # read (see db_target), and it is never printed:
    #   - it names the database dumped as econ_graph (PGHOST, PGPORT,
    #     PGDATABASE; APP_DATABASE=shared): the app tables are in the
    #     econ_graph dump, and the separate app dump is skipped with one log
    #     line;
    #   - it names ${APP_PGHOST}:${APP_PGPORT}/${APP_PGDATABASE} (a separate
    #     app database): the app database is dumped like the others, and a
    #     missing password or a failed dump fails the run;
    #   - it names anything else, or can't be read: a failed dump, since the
    #     database the backend keeps its users in would go unbacked;
    #   - there is none: skipped with one log line, unless APP_REQUIRED=true,
    #     which makes that a failed dump.
    # Keycloak is skipped when KEYCLOAK_PGPASSWORD is unset or empty, unless
    # KEYCLOAK_REQUIRED=true, which makes that a failed dump.
    #
    # Each dump is attempted even if the other fails, and a dump that fails
    # leaves nothing under a final name. Exit status: 1 if any dump failed,
    # unless BACKUP_STATUS_FILE is set; then the names of the failed dumps (an
    # empty line if none) are written there and the exit status is 0, so that
    # sync.sh still ships the dumps that succeeded before it fails the Job.
    set -eu

    BACKUP_DIR="${BACKUP_DIR:-/backups}"
    STAMP="$(date -u +%Y%m%d-%H%M%S)"
    # Fail on an unreachable server in seconds instead of hanging the Job.
    export PGCONNECT_TIMEOUT="${PGCONNECT_TIMEOUT:-30}"
    # pg_dump waits this long for its ACCESS SHARE lock on each table, then
    # fails that dump. Only an ACCESS EXCLUSIVE lock blocks it (a migration's
    # ALTER/DROP, VACUUM FULL, an explicit LOCK TABLE); none of those should
    # hold for 10 minutes, and failing beats waiting until the Job deadline.
    LOCK_WAIT_TIMEOUT="${PG_DUMP_LOCK_WAIT_TIMEOUT:-600s}"
    trap 'rm -f "${BACKUP_DIR}"/*-"${STAMP}".dump.partial' EXIT

    # dump_database NAME LATEST_LINK: dump the database the PG* env names to
    # ${BACKUP_DIR}/NAME-${STAMP}.dump and point ${BACKUP_DIR}/LATEST_LINK at
    # it. Every step checks its own status: set -e does not apply inside a
    # function called from an `if`.
    dump_database() {
      name="$1"
      dest="${BACKUP_DIR}/${name}-${STAMP}.dump"
      partial="${dest}.partial"

      echo "[${name}] Dumping database '${PGDATABASE}' from ${PGHOST}:${PGPORT} as ${PGUSER}"
      pg_dump --format=custom --no-owner --no-privileges \
        --lock-wait-timeout="${LOCK_WAIT_TIMEOUT}" --file="${partial}" ||
        { echo "[${name}] pg_dump failed" >&2; return 1; }

      if [ ! -s "${partial}" ]; then
        echo "[${name}] the dump is empty" >&2
        return 1
      fi

      echo "[${name}] Verifying archive integrity"
      pg_restore --file=/dev/null "${partial}" ||
        { echo "[${name}] the archive does not read back" >&2; return 1; }
      # A dump with no table at all (wrong database, schema never created)
      # restores to nothing, so it doesn't count as a backup.
      tables="$(pg_restore --list "${partial}" | awk '$4 == "TABLE" && $5 != "DATA"' | wc -l)"
      if [ "${tables}" -eq 0 ]; then
        echo "[${name}] the dump holds no table" >&2
        return 1
      fi

      # Only give the dump its final name (picked up by sync.sh / restore.sh)
      # once it's confirmed valid, so a failed or truncated dump never sits
      # under a name that looks like a good backup.
      mv "${partial}" "${dest}" || return 1
      ln -sf "${dest}" "${BACKUP_DIR}/$2" || return 1
      echo "[${name}] Backup OK: ${tables} tables, $(du -h "${dest}" | cut -f1) in ${dest}"
    }

    # db_target URL: prints "host:port/dbname" for a
    # postgresql://[user[:password]@]host[:port]/dbname[?options] URL, and
    # nothing for a URL it can't read that way (another scheme, no database,
    # several hosts, a host, port or database given in the options instead).
    # The host is lower-cased and loses only this namespace's Service suffix
    # (.econ-graph, .econ-graph.svc, .econ-graph.svc.cluster.local); an IP
    # literal is kept whole, an IPv6 one in its brackets. The data database's
    # alias postgres-service reads as data-postgres-service, and a missing
    # port as 5432. Nothing else of the URL is kept, and nothing is printed
    # but the result.
    db_target() {
      case "$1" in
        postgresql://*|postgres://*) ;;
        *) return 0 ;;
      esac
      rest="${1#*://}"
      query=""
      case "${rest}" in
        *\?*) query="${rest#*\?}"; rest="${rest%%\?*}" ;;
      esac
      case "&${query}" in
        *"&host="*|*"&hostaddr="*|*"&port="*|*"&dbname="*|*"&service="*) return 0 ;;
      esac
      case "${rest}" in
        */*) ;;
        *) return 0 ;;
      esac
      # The path is cut at the first '/' after the authority; any '@' left is
      # the userinfo's (create-secrets.sh percent-encodes the password).
      authority="${rest%%/*}"
      db="${rest#*/}"
      hostport="${authority##*@}"
      case "${hostport}" in
        \[*\]) host="${hostport}"; port="" ;;
        \[*\]:*) host="${hostport%%\]*}]"; port="${hostport##*\]:}" ;;
        *\[*|*\]*|*,*) return 0 ;;
        *:*) host="${hostport%%:*}"; port="${hostport#*:}" ;;
        *) host="${hostport}"; port="" ;;
      esac
      port="${port:-5432}"
      case "${port}" in
        *[!0-9]*) return 0 ;;
      esac
      case "${db}" in
        ''|*/*|*#*) return 0 ;;
      esac
      host="$(printf '%s' "${host}" | tr '[:upper:]' '[:lower:]')"
      for suffix in .econ-graph.svc.cluster.local .econ-graph.svc .econ-graph; do
        case "${host}" in
          *"${suffix}") host="${host%"${suffix}"}"; break ;;
        esac
      done
      if [ "${host}" = "postgres-service" ]; then
        host="data-postgres-service"
      fi
      if [ -z "${host}" ]; then
        return 0
      fi
      printf '%s:%s/%s\n' "${host}" "${port}" "${db}"
    }

    FAILED=""

    if ! dump_database econ_graph latest.dump; then
      FAILED="${FAILED} econ_graph"
    fi

    APP_HOST="${APP_PGHOST:-app-postgres-service}"
    APP_PORT="${APP_PGPORT:-5432}"
    APP_DB="${APP_PGDATABASE:-econ_graph_app}"
    APP_MODE="none"
    if [ -n "${APP_DATABASE_URL:-}" ]; then
      app_target="$(db_target "${APP_DATABASE_URL}")"
      if [ -z "${app_target}" ]; then
        APP_MODE="other"
      elif [ "${app_target}" = "$(db_target "postgresql://${PGHOST}:${PGPORT:-5432}/${PGDATABASE}")" ]; then
        APP_MODE="shared"
      elif [ "${app_target}" = "$(db_target "postgresql://${APP_HOST}:${APP_PORT}/${APP_DB}")" ]; then
        APP_MODE="separate"
      else
        APP_MODE="other"
      fi
    fi

    case "${APP_MODE}" in
      separate)
        if [ -z "${APP_PGPASSWORD:-}" ]; then
          echo "[econ_graph_app] app-database-url names ${APP_HOST}/${APP_DB} but APP_PGPASSWORD is empty (Secret econ-graph-app-postgres or its key postgres-password is missing)" >&2
          FAILED="${FAILED} econ_graph_app"
        # A subshell, so the app database's connection settings stay out of the
        # rest of the script.
        elif ! (
          export PGHOST="${APP_HOST}"
          export PGPORT="${APP_PORT}"
          export PGUSER="${APP_PGUSER:-postgres}"
          export PGDATABASE="${APP_DB}"
          export PGPASSWORD="${APP_PGPASSWORD}"
          dump_database econ_graph_app latest-econ_graph_app.dump
        ); then
          FAILED="${FAILED} econ_graph_app"
        fi
        ;;
      shared)
        echo "[econ_graph_app] app-database-url names the data database (APP_DATABASE=shared): the app tables are in the econ_graph dump; skipping the separate app dump"
        ;;
      other)
        echo "[econ_graph_app] app-database-url names neither the data database (${PGHOST}:${PGPORT:-5432}/${PGDATABASE}) nor ${APP_HOST}:${APP_PORT}/${APP_DB}, or can't be read; the app database it names is not backed up" >&2
        FAILED="${FAILED} econ_graph_app"
        ;;
      *)
        if [ "${APP_REQUIRED:-false}" = "true" ]; then
          echo "[econ_graph_app] APP_DATABASE_URL is empty (Secret econ-graph-secrets or its key app-database-url is missing), but APP_REQUIRED=true expects an app database" >&2
          FAILED="${FAILED} econ_graph_app"
        else
          echo "[econ_graph_app] APP_DATABASE_URL is empty (Secret econ-graph-secrets or its key app-database-url is missing); skipping the separate app dump"
        fi
        ;;
    esac

    if [ -n "${KEYCLOAK_PGPASSWORD:-}" ]; then
      # Likewise for Keycloak's connection settings.
      if ! (
        export PGHOST="${KEYCLOAK_PGHOST:-keycloak-postgres-service}"
        export PGPORT="${KEYCLOAK_PGPORT:-5432}"
        export PGUSER="${KEYCLOAK_PGUSER:-keycloak}"
        export PGDATABASE="${KEYCLOAK_PGDATABASE:-keycloak}"
        export PGPASSWORD="${KEYCLOAK_PGPASSWORD}"
        dump_database keycloak latest-keycloak.dump
      ); then
        FAILED="${FAILED} keycloak"
      fi
    elif [ "${KEYCLOAK_REQUIRED:-false}" = "true" ]; then
      echo "[keycloak] KEYCLOAK_PGPASSWORD is empty but KEYCLOAK_REQUIRED=true (Secret econ-graph-keycloak or its key db-password is missing)" >&2
      FAILED="${FAILED} keycloak"
    else
      echo "[keycloak] KEYCLOAK_PGPASSWORD is empty and KEYCLOAK_REQUIRED is not true (a cluster without Keycloak); skipping"
    fi

    # Backups are never deleted automatically. Old dumps are removed by hand
    # (see docs/deployment/POSTGRES_BACKUP_RESTORE.md, "Retention").

    if [ -n "${BACKUP_STATUS_FILE:-}" ]; then
      printf '%s\n' "${FAILED# }" > "${BACKUP_STATUS_FILE}"
    fi
    if [ -n "${FAILED}" ]; then
      echo "Backup FAILED for:${FAILED}" >&2
      if [ -n "${BACKUP_STATUS_FILE:-}" ]; then
        echo "Recorded in ${BACKUP_STATUS_FILE}; sync.sh ships the dumps that succeeded, then fails the Job." >&2
        exit 0
      fi
      exit 1
    fi
    echo "Done."

  sync.sh: |
    #!/bin/sh
    # Ships ${BACKUP_DIR} to S3 when BACKUP_DESTINATION=s3. Then, when
    # BACKUP_STATUS_FILE is set, exits 1 if backup.sh recorded a failed dump
    # there (or wrote no status at all), so the Job fails after the dumps that
    # did succeed are off the PVC.
    set -eu

    BACKUP_DIR="${BACKUP_DIR:-/backups}"
    DESTINATION="${BACKUP_DESTINATION:-}"

    if [ "${DESTINATION}" != "s3" ]; then
      echo "BACKUP_DESTINATION not set to 's3'; backups stay on the PVC only."
    else
      if [ -z "${BACKUP_S3_BUCKET:-}" ]; then
        echo "BACKUP_DESTINATION=s3 but BACKUP_S3_BUCKET is empty" >&2
        exit 1
      fi

      ENDPOINT_ARGS=""
      if [ -n "${BACKUP_S3_ENDPOINT:-}" ]; then
        ENDPOINT_ARGS="--endpoint-url ${BACKUP_S3_ENDPOINT}"
      fi

      echo "Syncing ${BACKUP_DIR} to s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX:-}"
      # The latest*.dump symlinks (latest.dump, latest-econ_graph_app.dump,
      # latest-keycloak.dump) point at dumps already being synced, and
      # `aws s3 sync` follows symlinks by default, which would upload the same
      # content twice under two keys. A *.partial is a dump that never
      # finished (its pod was killed mid-dump).
      # shellcheck disable=SC2086
      aws s3 sync "${BACKUP_DIR}" "s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX:-}" \
        --exclude "latest*.dump" --exclude "*.partial" \
        ${ENDPOINT_ARGS} --only-show-errors
      echo "Sync complete."
    fi

    if [ -n "${BACKUP_STATUS_FILE:-}" ]; then
      if [ ! -f "${BACKUP_STATUS_FILE}" ]; then
        echo "backup.sh wrote no status to ${BACKUP_STATUS_FILE}; failing the Job" >&2
        exit 1
      fi
      FAILED="$(cat "${BACKUP_STATUS_FILE}")"
      if [ -n "${FAILED}" ]; then
        echo "Backup FAILED for: ${FAILED} (see the pg-dump container's log); failing the Job" >&2
        exit 1
      fi
    fi

  restore.sh: |
    #!/bin/sh
    set -eu

    BACKUP_DIR="${BACKUP_DIR:-/backups}"
    FILE="${BACKUP_FILE:-${BACKUP_DIR}/latest.dump}"

    if [ ! -e "${FILE}" ]; then
      echo "Backup file not found: ${FILE}" >&2
      echo "Available backups in ${BACKUP_DIR}:" >&2
      ls -1 "${BACKUP_DIR}"/econ_graph-*.dump 1>&2 2>/dev/null || echo "  (none)" >&2
      exit 1
    fi

    # The backup volume also holds the app database's and Keycloak's dumps;
    # restoring one of those here would add their tables to ${PGDATABASE}.
    # (econ_graph_app-<stamp>.dump doesn't match econ_graph-*.)
    case "$(basename "$(readlink -f "${FILE}")")" in
      "${PGDATABASE}"-*) ;;
      *)
        echo "${FILE} is not a ${PGDATABASE} dump (expected ${PGDATABASE}-<stamp>.dump)" >&2
        exit 1
        ;;
    esac

    # --single-transaction: a failed restore rolls back cleanly instead of
    # leaving the database with some objects dropped and never recreated.
    if [ -z "${RESTORE_ROLE:-}" ]; then
      echo "Restoring ${FILE} into database '${PGDATABASE}' on ${PGHOST}:${PGPORT}"
      pg_restore --clean --if-exists --no-owner --no-privileges \
        --single-transaction --exit-on-error \
        --dbname="${PGDATABASE}" "${FILE}"
    else
      # The dumps carry no owner (--no-owner). Restoring as ${RESTORE_ROLE}
      # (SET ROLE after connecting) makes it the owner of everything recreated,
      # as it was: the role the backend and crawler connect as, which created
      # those objects through the migrations. Without it they would belong to
      # ${PGUSER}, and the services could not use them.
      #
      # The extensions stay as they are: the database's init script created
      # some as the superuser, and ${RESTORE_ROLE} can't drop or recreate
      # those. Each extension the dump has must already exist.
      TOC="$(pg_restore --list "${FILE}")"
      for ext in $(printf '%s\n' "${TOC}" | awk '$4 == "EXTENSION" && $5 == "-" { print $6 }'); do
        # Through stdin, as psql doesn't substitute :'ext' in a -c command.
        found="$(echo "SELECT count(*) FROM pg_extension WHERE extname = :'ext'" |
          psql -X -At -v ON_ERROR_STOP=1 -v ext="${ext}")"
        if [ "${found}" != "1" ]; then
          echo "The dump needs extension ${ext}, which '${PGDATABASE}' doesn't have; create it first" >&2
          exit 1
        fi
      done
      echo "Restoring ${FILE} into database '${PGDATABASE}' on ${PGHOST}:${PGPORT} as role ${RESTORE_ROLE}"
      # TOC entry lines read "<id>; <catalog> <oid> <TYPE> <schema> <name> <owner>";
      # an extension's comment is "COMMENT - EXTENSION <name>". Only those
      # two kinds of entry are left out, by their type column.
      printf '%s\n' "${TOC}" |
        awk '!($4 == "EXTENSION" || ($4 == "COMMENT" && $6 == "EXTENSION"))' |
        pg_restore --clean --if-exists --no-owner --no-privileges \
          --role="${RESTORE_ROLE}" --use-list=/dev/stdin \
          --single-transaction --exit-on-error \
          --dbname="${PGDATABASE}" "${FILE}"
    fi

    echo "Restore complete."
