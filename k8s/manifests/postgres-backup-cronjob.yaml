# Nightly PostgreSQL backup.
#
# Writes a pg_dump of econ_graph and of Keycloak's database to
# postgres-backup-data (a PVC separate from both databases' own
# volumes, see postgres-backup-pvc.yaml), so a lost/corrupted/torn-down
# primary volume doesn't take the backups with it.
#
# If one database's dump fails, the other is still taken and kept: pg-dump
# (backup.sh) records the failure in the status emptyDir and exits 0, and
# backup-sync (sync.sh) syncs what was written, then exits 1 so the Job fails
# (without a retry, see podFailurePolicy).
#
# KEYCLOAK_REQUIRED is true: a missing Secret econ-graph-keycloak (or key
# db-password) fails the run. On a cluster deployed without Keycloak, set it
# to "false" and backup.sh skips Keycloak:
#   kubectl -n econ-graph set env cronjob/postgres-backup -c pg-dump KEYCLOAK_REQUIRED=false
#
# To also ship backups to object storage, set BACKUP_DESTINATION=s3 and the
# BACKUP_S3_* env vars below (and provide AWS credentials, e.g. via a
# Secret referenced through envFrom). The sync container is a no-op when
# BACKUP_DESTINATION is unset, so the PVC-only dev default needs no further
# configuration.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: econ-graph
  labels:
    app: postgres-backup
    component: backup
spec:
  schedule: "0 8 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A deadline, so a hung run can't hold the Forbid concurrency policy and
      # block every later night. 4 hours: econ_graph's volume is 50Gi
      # (postgres-deployment.yaml); pg_dump --format=custom runs at about
      # 25MB/s of database on a single core (measured with postgres:18 on a
      # synthetic 1.5GB data_points-like table) and the
      # read-back check is several times faster, so a full 50GiB database
      # takes about 40 minutes. The Keycloak dump is small. backup.sh's
      # 10-minute lock wait per dump fits as well, with room for the sync.
      activeDeadlineSeconds: 14400
      # Retries only for pod disruptions (eviction, node loss), which end the
      # pod without a container exit code. A container that exits non-zero
      # fails the Job at once: a dump that failed (pg-dump recorded it, then
      # backup-sync exits 1) would fail again, and each retry writes another
      # full dump of every database that did succeed, which nothing prunes.
      backoffLimit: 2
      podFailurePolicy:
        rules:
        - action: FailJob
          onExitCodes:
            operator: NotIn
            values: [0]
      template:
        metadata:
          labels:
            app: postgres-backup
            component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          initContainers:
          - name: pg-dump
            image: postgres:18
            command: ["/scripts/backup.sh"]
            env:
            - name: PGHOST
              value: "postgres-service"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: econ-graph-postgres
                  key: postgres-password
            - name: PGDATABASE
              value: "econ_graph"
            # Keycloak's database (k8s/manifests/keycloak/postgres.yaml). The
            # Secret is optional so that the pod still starts, and econ_graph
            # is still dumped, when it is missing; KEYCLOAK_REQUIRED decides
            # whether that is a failure (see the top).
            - name: KEYCLOAK_REQUIRED
              value: "true"
            - name: KEYCLOAK_PGHOST
              value: "keycloak-postgres-service"
            - name: KEYCLOAK_PGPORT
              value: "5432"
            - name: KEYCLOAK_PGUSER
              value: "keycloak"
            - name: KEYCLOAK_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: econ-graph-keycloak
                  key: db-password
                  optional: true
            - name: KEYCLOAK_PGDATABASE
              value: "keycloak"
            - name: BACKUP_DIR
              value: "/backups"
            - name: BACKUP_STATUS_FILE
              value: "/status/failed"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: backup-data
              mountPath: /backups
            - name: status
              mountPath: /status
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          containers:
          - name: backup-sync
            image: amazon/aws-cli:2.38.5
            command: ["/scripts/sync.sh"]
            env:
            - name: BACKUP_DIR
              value: "/backups"
            - name: BACKUP_DESTINATION
              value: "" # set to "s3" to also push to object storage
            - name: BACKUP_S3_BUCKET
              value: ""
            - name: BACKUP_S3_PREFIX
              value: "postgres/econ-graph"
            - name: BACKUP_S3_ENDPOINT
              value: "" # optional, for S3-compatible endpoints (e.g. MinIO)
            - name: BACKUP_STATUS_FILE
              value: "/status/failed"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: backup-data
              mountPath: /backups
              readOnly: true
            - name: status
              mountPath: /status
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          volumes:
          - name: scripts
            configMap:
              name: postgres-backup-scripts
              defaultMode: 0555
          - name: backup-data
            persistentVolumeClaim:
              claimName: postgres-backup-data
          # Which dumps failed, from pg-dump to backup-sync (see the top).
          - name: status
            emptyDir:
              sizeLimit: 1Mi
