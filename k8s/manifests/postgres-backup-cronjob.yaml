# Nightly PostgreSQL backup.
#
# Writes a pg_dump of each of the three databases (the app database only when
# app-database-url names it, see below), the data database
# econ_graph (StatefulSet postgresql, data-postgres-service), the app
# database econ_graph_app (StatefulSet app-postgres, app-postgres-service) and
# Keycloak's keycloak (StatefulSet keycloak-postgres,
# keycloak-postgres-service), to postgres-backup-data (a PVC separate from the
# databases' own volumes, see postgres-backup-pvc.yaml), so a
# lost/corrupted/torn-down primary volume doesn't take the backups with it.
# On threadripper the host-side dumps (scripts/backup/dump-databases.sh, see
# docs/deployment/BACKUPS.md) cover the same databases; this job is a second,
# independent copy.
#
# If one database's dump fails, the others are still taken and kept: pg-dump
# (backup.sh) records the failure in the status emptyDir and exits 0, and
# backup-sync (sync.sh) syncs what was written, then exits 1 so the Job fails
# (without a retry, see podFailurePolicy).
#
# The app database is dumped only when the backend's app-database-url names it
# (APP_DATABASE=separate). With APP_DATABASE=shared, app-database-url names the
# data database, the app tables are in the econ_graph dump, and backup.sh logs
# that and skips the separate app dump. An app-database-url that names any other
# database, or can't be read, fails the run. A missing one is skipped, unless
# APP_REQUIRED=true, which makes it a failure:
#   kubectl -n econ-graph set env cronjob/postgres-backup -c pg-dump APP_REQUIRED=true
#
# KEYCLOAK_REQUIRED is true: a missing Secret econ-graph-keycloak (or key
# db-password) fails the run. On a cluster deployed without Keycloak, set it to
# "false" and backup.sh skips Keycloak:
#   kubectl -n econ-graph set env cronjob/postgres-backup -c pg-dump KEYCLOAK_REQUIRED=false
#
# To also ship backups to object storage, set BACKUP_DESTINATION=s3 and the
# BACKUP_S3_* env vars below (and provide AWS credentials, e.g. via a
# Secret referenced through envFrom). The sync container is a no-op when
# BACKUP_DESTINATION is unset, so the PVC-only dev default needs no further
# configuration.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: econ-graph
  labels:
    app: postgres-backup
    component: backup
spec:
  schedule: "0 8 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A deadline, so a hung run can't hold the Forbid concurrency policy and
      # block every later night. 4 hours: the volumes are 50Gi for econ_graph
      # (postgres-deployment.yaml), 10Gi for econ_graph_app (app-postgres.yaml)
      # and 5Gi for keycloak (keycloak/postgres.yaml); pg_dump --format=custom
      # runs at about 25MB/s of database on a single core (measured with
      # postgres:18 on a synthetic 1.5GB data_points-like table) and the
      # read-back check is several times faster, so all three, full, take
      # about 50 minutes. backup.sh's 10-minute lock wait per dump fits as
      # well, with room for the sync.
      activeDeadlineSeconds: 14400
      # Retries only for pod disruptions (eviction, node drain, preemption, node
      # loss; the DisruptionTarget rule below). A container that exits non-zero
      # fails the Job at once: a dump that failed (pg-dump recorded it, then
      # backup-sync exits 1) would fail again, and each retry writes another
      # full dump of every database that did succeed, which nothing prunes.
      backoffLimit: 2
      podFailurePolicy:
        rules:
        # An eviction, node drain or preemption kills the containers (exit 137
        # once SIGTERM is ignored by sh as PID 1), so it is matched first by its
        # DisruptionTarget condition and retried within backoffLimit.
        - action: Count
          onPodConditions:
          - type: DisruptionTarget
        - action: FailJob
          onExitCodes:
            operator: NotIn
            values: [0]
      template:
        metadata:
          labels:
            app: postgres-backup
            component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          initContainers:
          - name: pg-dump
            image: postgres:18
            command: ["/scripts/backup.sh"]
            env:
            # The data database (postgres-deployment.yaml, Services in
            # postgres.yaml).
            - name: PGHOST
              value: "data-postgres-service"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: econ-graph-postgres
                  key: postgres-password
            - name: PGDATABASE
              value: "econ_graph"
            # The app database (k8s/manifests/app-postgres.yaml), as its
            # superuser, when app-database-url names it (see the top).
            # backup.sh reads only its host, port and database name, and never
            # prints it. All the Secrets are optional so that the pod still
            # starts, and the other databases are still dumped, when one is
            # missing.
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: econ-graph-secrets
                  key: app-database-url
                  optional: true
            - name: APP_REQUIRED
              value: "false"
            - name: APP_PGHOST
              value: "app-postgres-service"
            - name: APP_PGPORT
              value: "5432"
            - name: APP_PGUSER
              value: "postgres"
            - name: APP_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: econ-graph-app-postgres
                  key: postgres-password
                  optional: true
            - name: APP_PGDATABASE
              value: "econ_graph_app"
            # Keycloak's database (k8s/manifests/keycloak/postgres.yaml), the
            # same way, with KEYCLOAK_REQUIRED.
            - name: KEYCLOAK_REQUIRED
              value: "true"
            - name: KEYCLOAK_PGHOST
              value: "keycloak-postgres-service"
            - name: KEYCLOAK_PGPORT
              value: "5432"
            - name: KEYCLOAK_PGUSER
              value: "keycloak"
            - name: KEYCLOAK_PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: econ-graph-keycloak
                  key: db-password
                  optional: true
            - name: KEYCLOAK_PGDATABASE
              value: "keycloak"
            - name: BACKUP_DIR
              value: "/backups"
            - name: BACKUP_STATUS_FILE
              value: "/status/failed"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: backup-data
              mountPath: /backups
            - name: status
              mountPath: /status
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          containers:
          - name: backup-sync
            image: amazon/aws-cli:2.38.5
            command: ["/scripts/sync.sh"]
            env:
            - name: BACKUP_DIR
              value: "/backups"
            - name: BACKUP_DESTINATION
              value: "" # set to "s3" to also push to object storage
            - name: BACKUP_S3_BUCKET
              value: ""
            - name: BACKUP_S3_PREFIX
              value: "postgres/econ-graph"
            - name: BACKUP_S3_ENDPOINT
              value: "" # optional, for S3-compatible endpoints (e.g. MinIO)
            - name: BACKUP_STATUS_FILE
              value: "/status/failed"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: backup-data
              mountPath: /backups
              readOnly: true
            - name: status
              mountPath: /status
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          volumes:
          - name: scripts
            configMap:
              name: postgres-backup-scripts
              defaultMode: 0555
          - name: backup-data
            persistentVolumeClaim:
              claimName: postgres-backup-data
          # Which dumps failed, from pg-dump to backup-sync (see the top).
          - name: status
            emptyDir:
              sizeLimit: 1Mi
