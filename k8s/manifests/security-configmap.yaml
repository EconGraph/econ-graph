apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-security-config
  namespace: econ-graph
  labels:
    app: nginx-ingress
data:
  # Security configuration for nginx ingress controller.
  # NOTE: as of 2026-09, nothing mounts this ConfigMap into a Deployment or Ingress; the headers
  # actually served come from the ssl-ingress.yaml / terraform/modules/ingress annotations instead.
  # The location blocks below are directive snippets, not complete server blocks: each needs the
  # same proxy_pass/root as the surrounding server block wherever this file is included.
  security.conf: |
    # Security headers for all responses. Only /silent-callback.html (the sign-in iframe) may be
    # framed, and only by this origin; see the location block below.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.econ-graph.com wss:; frame-ancestors 'none';" always;
    
    # Hide nginx version
    server_tokens off;
    
    # Disable server signature
    more_clear_headers 'Server';
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 20;
    
    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # Timeout configurations
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Buffer configurations
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # The Keycloak silent sign-in page loads in a hidden iframe on our own pages. nginx does not
    # merge add_header directives across contexts: as soon as a location adds one, none of the
    # parent block's add_header lines apply here, so every header this path needs is repeated.
    location = /silent-callback.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'self';" always;
    }

    # Security for sensitive endpoints
    location ~ ^/(admin|grafana|api/admin) {
        # Additional security for admin endpoints
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Rate limiting for admin endpoints
        limit_req zone=login burst=5 nodelay;
        
        # IP whitelist (configure as needed)
        # allow 192.168.1.0/24;
        # deny all;
    }
    
    # Security for API endpoints
    location ~ ^/api {
        # Rate limiting for API
        limit_req zone=api burst=20 nodelay;
        
        # CORS is enforced by the backend from CORS_ALLOWED_ORIGINS.
    }
    
    # Security for GraphQL endpoint
    location ~ ^/graphql {
        # Rate limiting for GraphQL
        limit_req zone=api burst=30 nodelay;
        
        # CORS is enforced by the backend from CORS_ALLOWED_ORIGINS.
    }
