apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: econ-graph-frontend-ingress
  namespace: econ-graph
  annotations:
    # CORS is enforced by the backend from CORS_ALLOWED_ORIGINS; no ingress CORS annotations.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "5"
spec:
  ingressClassName: nginx
  rules:
  - host: frontend.econ-graph.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: econ-graph-frontend-service
            port:
              number: 3000
