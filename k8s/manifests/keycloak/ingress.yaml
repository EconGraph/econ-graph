# Routes Keycloak's public paths under /idp on the kind ingress host. Only the paths
# Keycloak recommends exposing are routed: /realms (login, tokens, discovery) and
# /resources (login page assets). The admin console, /admin, stays internal (see
# deployment.yaml). Kept out of ingress.yaml so its CORS annotations do not apply:
# Keycloak sets CORS itself from each client's web origins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: econ-graph
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Keycloak's session cookies and redirects exceed nginx's default 4k buffer.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /idp/realms
        pathType: Prefix
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080
      - path: /idp/resources
        pathType: Prefix
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080
