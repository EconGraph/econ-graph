# keycloak-postgres: Keycloak's own PostgreSQL database, separate from the app DB.
#
# The password comes from the Secret `econ-graph-keycloak` (key db-password),
# written by scripts/deploy/create-secrets.sh. Postgres reads it only when the data
# volume is first initialised.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres-service
  namespace: econ-graph
  labels:
    app: keycloak-postgres
spec:
  type: ClusterIP
  selector:
    app: keycloak-postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  namespace: econ-graph
  labels:
    app: keycloak-postgres
    version: "18"
spec:
  serviceName: keycloak-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      labels:
        app: keycloak-postgres
        version: "18"
    spec:
      # Pinned to the kind worker that bind-mounts the host subvolumes.
      nodeSelector:
        econgraph.io/host-storage: "true"
      # The PV is a host directory (k8s/manifests/host-storage.yaml). fsGroup
      # doesn't apply to hostPath volumes, so hand the volume root to the postgres
      # user (999) here. The cluster runs on rootful Docker (no user namespace), so
      # uid 999 in the pod is uid 999 on the host; see docs/deployment/HOST_STORAGE.md.
      initContainers:
      - name: init-data-dir
        image: postgres:18
        # This script, comments included, is part of the pod template: any edit
        # restarts the database on the next deploy. scripts/deploy/
        # check-host-storage-fixture.py compares it with production's
        # (scripts/deploy/testdata/production-host-storage.json), comments aside.
        command:
        - sh
        - -ec
        - |
          root="$1"; pgdata="$2"
          # The host directory starts out owned by the operator account. Postgres runs
          # as 999 and has to create PGDATA inside it, so hand the volume root over.
          chown 999:999 "$root"
          chmod 0700 "$root"
          # A data directory restored by a copy that didn't keep ownership (anything
          # but 999:999) would stop Postgres starting; fix it once.
          if [ -e "$pgdata" ] && [ "$(stat -c %u:%g "$pgdata")" != "999:999" ]; then
            echo "fixing ownership of $pgdata"
            chown -R 999:999 "$pgdata"
          fi
          stat -c '%n %u:%g %a' "$root"
        - init-data-dir
        - /var/lib/postgresql
        - /var/lib/postgresql/18/docker
        volumeMounts:
        - name: keycloak-postgres-data
          mountPath: /var/lib/postgresql
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER", "DAC_READ_SEARCH"]
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "keycloak"
        - name: POSTGRES_USER
          value: "keycloak"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: db-password
        volumeMounts:
        - name: keycloak-postgres-data
          mountPath: /var/lib/postgresql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      securityContext:
        # Not applied to hostPath volumes; ownership is set by init-data-dir.
        fsGroup: 999
  volumeClaimTemplates:
  - metadata:
      name: keycloak-postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      # Static PV on the host subvolume (k8s/manifests/host-storage.yaml).
      storageClassName: econgraph-host
      volumeName: econgraph-app-prod-keycloak-pg
      resources:
        requests:
          storage: 5Gi
