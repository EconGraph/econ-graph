# keycloak: OIDC identity provider for EconGraph (realm `econ-graph`).
#
# Public URL: http://localhost/idp through the gateway (HTTPRoute econ-graph-idp,
# k8s/manifests/gateway/routes/httproutes.yaml), so the issuer is
# http://localhost/idp/realms/econ-graph. With PUBLIC_HOST set, deploy.sh changes
# KC_HOSTNAME, KC_WEB_BASE_URL and KC_WEB_E2E_BASE_URL below to https://<PUBLIC_HOST>, the backend's
# OIDC_ISSUER and the routes' host names with them (scripts/deploy/render-public-host.py),
# so the issuer is https://econgraph.com/idp/realms/econ-graph in production. Keycloak
# builds its URLs from the full KC_HOSTNAME, not from request headers, and the public
# host is only served over https (plain http is redirected; scripts/deploy/render-public-host.py).
#
# Credentials come only from the Secret `econ-graph-keycloak`, written by
# scripts/deploy/create-secrets.sh (never committed):
#   admin-username, admin-password  bootstrap admin (created on the first start only)
#   db-password                     keycloak-postgres password
#   google-idp-client-id, google-idp-client-secret  optional; Google sign-in is
#                                   enabled when both are present
#
# The realm comes from the ConfigMap `keycloak-realm`, generated by deploy.sh from
# config/keycloak/econ-graph-realm.json. The seeded dev and QA test users are for the
# local compose stack only and never deployed (CI enforces this).
#
# The Job in realm-import-job.yaml creates the realm on the first deploy and applies
# it on every deploy after, so later changes to it (roles, clients, the Google client)
# reach the cluster without touching ordinary users. The import preserves operator-managed
# catalog grants before applying the structural configuration. Keycloak itself does not import anything:
# --import-realm would create resources (roles, composites) directly that
# keycloak-config-cli does not then own, so removing one from the file later would
# leave it behind in the cluster.
#
# The admin console is not routed by the gateway. Reach it with
#   kubectl -n econ-graph port-forward svc/keycloak-service 18080:8080
# and open http://localhost:18080/idp/admin (KC_HOSTNAME_ADMIN below).
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: econ-graph
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: econ-graph
  labels:
    app: keycloak
    component: auth
spec:
  # One replica: several need Keycloak's distributed cache configured first.
  replicas: 1
  # Recreate, not RollingUpdate: a new Keycloak version migrates the database schema on
  # first start, and Keycloak supports old and new pods sharing a database only within
  # one version stream. Recreate stops the old pod before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        component: auth
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.8.1
        # Enable the Google identity provider only when its client id and secret are configured.
        command: ["/bin/bash", "-c"]
        args:
        - |
          if [ -n "${KC_GOOGLE_CLIENT_ID:-}" ] && [ -n "${KC_GOOGLE_CLIENT_SECRET:-}" ]; then export KC_GOOGLE_ENABLED=true; fi
          if [ -n "${KC_FACEBOOK_CLIENT_ID:-}" ] && [ -n "${KC_FACEBOOK_CLIENT_SECRET:-}" ]; then export KC_FACEBOOK_ENABLED=true; fi
          exec /opt/keycloak/bin/kc.sh start
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: admin-username
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: admin-password
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://keycloak-postgres-service:5432/keycloak"
        - name: KC_DB_USERNAME
          value: "keycloak"
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: db-password
        - name: KC_HOSTNAME
          value: "http://localhost/idp"
        - name: KC_HOSTNAME_ADMIN
          value: "http://localhost:18080/idp"
        - name: KC_HTTP_RELATIVE_PATH
          value: "/idp"
        # Plain HTTP behind the gateway; TLS, when configured, terminates at the gateway.
        - name: KC_HTTP_ENABLED
          value: "true"
        # Only for the client address in Keycloak's events and brute-force detection: the
        # gateway sets X-Forwarded-For to the client address it settled on and drops a
        # client's X-Forwarded-Proto/-Host (k8s/manifests/gateway/client-traffic-policy.yaml).
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HEALTH_ENABLED
          value: "true"
        # Placeholders in config/keycloak/econ-graph-realm.json
        - name: KC_ANONYMOUS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: anonymous-client-secret
        - name: KC_WEB_BASE_URL
          value: "http://localhost"
        # Second allowed web origin: the compose e2e stack's frontend there. With PUBLIC_HOST,
        # deploy.sh sets it to the public host like KC_WEB_BASE_URL, so the realm allows no
        # localhost.
        - name: KC_WEB_E2E_BASE_URL
          value: "http://localhost"
        - name: KC_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: google-idp-client-id
              optional: true
        - name: KC_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: google-idp-client-secret
              optional: true
        - name: KC_FACEBOOK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: facebook-idp-client-id
              optional: true
        - name: KC_FACEBOOK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: econ-graph-keycloak
              key: facebook-idp-client-secret
              optional: true
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: management
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # The first start builds Keycloak's optimized image, and the first start of a new
        # version migrates the database, which can take long on a big one. 180 x 5s = 900s,
        # the same as deploy.sh's rollout wait, so a slow migration is not killed early.
        startupProbe:
          httpGet:
            path: /idp/health/started
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 180
        livenessProbe:
          httpGet:
            path: /idp/health/live
            port: management
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /idp/health/ready
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
