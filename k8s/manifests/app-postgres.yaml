# app-postgres: the app database, econ_graph_app (users and everything they
# create). The data database is the StatefulSet postgresql
# (postgres-deployment.yaml); Keycloak has its own (keycloak/postgres.yaml).
#
# Passwords come from the Secret econ-graph-app-postgres (keys postgres-password
# and app-password), written by scripts/deploy/create-secrets.sh. Postgres
# reads them only when the data volume is first initialised; app-postgres-init.yaml
# then creates the role econgraph that app-database-url connects as.
#
# Storage: the static PV econgraph-app-prod-app-pg on the host subvolume
# /srv/econgraph/app-prod/app-pg (host-storage.yaml).
apiVersion: v1
kind: Service
metadata:
  name: app-postgres-service
  namespace: econ-graph
  labels:
    app: app-postgres
spec:
  type: ClusterIP
  selector:
    app: app-postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-postgres
  namespace: econ-graph
  labels:
    app: app-postgres
    version: "18"
spec:
  serviceName: app-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: app-postgres
  template:
    metadata:
      labels:
        app: app-postgres
        version: "18"
    spec:
      # Pinned to the kind worker that bind-mounts the host subvolumes.
      nodeSelector:
        econgraph.io/host-storage: "true"
      # The PV is a host directory (k8s/manifests/host-storage.yaml). fsGroup
      # doesn't apply to hostPath volumes, so hand the volume root to the postgres
      # user (999) here. The cluster runs on rootful Docker (no user namespace), so
      # uid 999 in the pod is uid 999 on the host; see docs/deployment/HOST_STORAGE.md.
      initContainers:
      - name: init-data-dir
        image: postgres:18
        command:
        - sh
        - -ec
        - |
          root="$1"; pgdata="$2"
          # The host directory starts out owned by the operator account. Postgres runs
          # as 999 and has to create PGDATA inside it, so hand the volume root over.
          chown 999:999 "$root"
          chmod 0700 "$root"
          # A data directory restored by a copy that didn't keep ownership (anything
          # but 999:999) would stop Postgres starting; fix it once.
          if [ -e "$pgdata" ] && [ "$(stat -c %u:%g "$pgdata")" != "999:999" ]; then
            echo "fixing ownership of $pgdata"
            chown -R 999:999 "$pgdata"
          fi
          stat -c '%n %u:%g %a' "$root"
        - init-data-dir
        - /data
        - /data/pgdata
        volumeMounts:
        - name: app-postgres-data
          mountPath: /data
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER", "DAC_READ_SEARCH"]
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "econ_graph_app"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-app-postgres
              key: postgres-password
        # Read by the init script in app-postgres-init.yaml to create the role econgraph.
        - name: APP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: econ-graph-app-postgres
              key: app-password
        - name: PGDATA
          value: "/data/pgdata"
        volumeMounts:
        - name: app-postgres-data
          mountPath: /data
        - name: app-postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "econ_graph_app"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "econ_graph_app"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: app-postgres-init
        configMap:
          name: app-postgres-init
          # Executable, so the entrypoint runs the init script in its own shell
          # instead of sourcing it.
          defaultMode: 0555
      securityContext:
        # Not applied to hostPath volumes; ownership is set by init-data-dir.
        fsGroup: 999
  volumeClaimTemplates:
  - metadata:
      name: app-postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      # Static PV on the host subvolume (k8s/manifests/host-storage.yaml).
      storageClassName: econgraph-host
      volumeName: econgraph-app-prod-app-pg
      resources:
        requests:
          storage: 10Gi
