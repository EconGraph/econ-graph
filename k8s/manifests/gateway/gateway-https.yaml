# Listener https of Gateway econ-graph-gateway (gateway.yaml). Applied by
# scripts/deploy/install-gateway.sh only when GATEWAY_HTTPS_HOSTNAME is set;
# the script fills in the two placeholders. It is applied under its own
# server-side-apply field manager, so it adds this listener (and the
# annotation) to the Gateway without owning the rest, and the script removes
# both again, and deletes the EnvoyPatchPolicy below, when the variable is
# empty.
#
# TLS terminates here with Secret econ-graph-tls in this namespace, which
# cert-manager issues from the ClusterIssuer named in the annotation
# (cert-manager runs with its Gateway API support enabled; see deploy.sh).
# Only namespaces labelled econgraph.io/env: production attach to this listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: econ-graph-gateway
  namespace: econ-graph-gateway
  annotations:
    cert-manager.io/cluster-issuer: __GATEWAY_TLS_ISSUER__
spec:
  gatewayClassName: econ-graph
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: __GATEWAY_HTTPS_HOSTNAME__
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: econ-graph-tls
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            econgraph.io/env: production
---
# The rate-limit bursts of ratelimit-burst.yaml, for this listener.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: econ-graph-ratelimit-burst-https
  namespace: econ-graph-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: econ-graph-gateway
  type: JSONPatch
  jsonPatches:
  - type: type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: econ-graph-gateway/econ-graph-gateway/https
    operation:
      op: replace
      jsonPath: "$.virtual_hosts[*].routes[?(@.name =~ /^httproute\\/[^\\/]+\\/econ-graph-(data-)?graphql\\//)]"
      path: /typed_per_filter_config/envoy.filters.http.local_ratelimit/descriptors/0/token_bucket/max_tokens
      value: 100
  - type: type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: econ-graph-gateway/econ-graph-gateway/https
    operation:
      op: replace
      jsonPath: "$.virtual_hosts[*].routes[?(@.name =~ /^httproute\\/[^\\/]+\\/econ-graph-(data-)?graphql\\//)]"
      path: /typed_per_filter_config/envoy.filters.http.local_ratelimit/descriptors/1/token_bucket/max_tokens
      value: 100
