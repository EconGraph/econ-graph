# Forwarding headers the clients cannot forge. Applied by
# scripts/deploy/install-gateway.sh.
#
# Envoy appends the client's address to an X-Forwarded-For header the client
# sent, so "X-Forwarded-For: 1.2.3.4" would reach the services as
# "1.2.3.4, <real address>". Keycloak (KC_PROXY_HEADERS=xforwarded) and the
# backend read the leftmost entry. The client's forwarding headers are
# therefore dropped before Envoy adds its own: X-Forwarded-For then holds
# only the address the proxy saw, and X-Forwarded-Proto is set by Envoy from
# the listener. X-Forwarded-Host, X-Forwarded-Port, Forwarded and X-Real-IP
# are not set by Envoy, so a client's copy is dropped and none is sent.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: econ-graph-client-headers
  namespace: econ-graph-gateway
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: econ-graph-gateway
  headers:
    earlyRequestHeaders:
      remove:
      - X-Forwarded-For
      - X-Forwarded-Host
      - X-Forwarded-Port
      - X-Forwarded-Proto
      - Forwarded
      - X-Real-IP
