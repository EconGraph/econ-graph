# A self-signed ClusterIssuer for the gateway's https listener certificate
# (gateway-https.yaml), the default: behind the Cloudflare Tunnel only the
# in-cluster connector sees that certificate, and it does not verify it
# (No TLS Verify on the tunnel's public hostnames). Applied by
# scripts/deploy/apply-gateway-routes.sh when it is the issuer in use.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: econ-graph-selfsigned
spec:
  selfSigned: {}
