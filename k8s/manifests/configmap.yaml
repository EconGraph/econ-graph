apiVersion: v1
kind: ConfigMap
metadata:
  name: econ-graph-config
  namespace: econ-graph
data:
  # Port Configuration
  BACKEND_PORT: "9876"
  FRONTEND_PORT: "3000"
  ADMIN_FRONTEND_PORT: "3001"
  DATABASE_PORT: "5432"

  # Backend configuration. Credentials, including APP_DATABASE_URL and
  # DATA_DATABASE_URL, live in the econ-graph-secrets Secret created by
  # scripts/deploy/create-secrets.sh, keys app-database-url and
  # data-database-url (see "Databases" in k8s/README.md).
  RUST_LOG: "info"
  # Browsers send Origin on same-origin POSTs too, and the backend refuses any origin not
  # listed, so the origin the app is served from (http://localhost on the kind ingress) must
  # be here. With a public host, deploy.sh replaces this list with the public origin, its www
  # name and http://localhost (scripts/deploy/render-public-host.py).
  CORS_ORIGIN: "http://localhost,http://localhost:3000"

  # Chart API Service configuration
  CHART_API_SERVICE_URL: "http://chart-api-service.econ-graph.svc.cluster.local:3001/api/chart"

  # Frontend configuration
  REACT_APP_API_URL: "http://localhost"
  REACT_APP_BACKEND_PORT: "9876"
  REACT_APP_FRONTEND_PORT: "3000"
  REACT_APP_GRAPHQL_URL: "/graphql"
  REACT_APP_WS_URL: "ws://localhost/graphql"
  REACT_APP_FACEBOOK_APP_ID: "demo-facebook-app-id"
  REACT_APP_GOOGLE_CLIENT_ID: "80227441551-3dv05tkflnfrjpqv5fgii7b8br0brt7m.apps.googleusercontent.com"

  # Admin Frontend configuration
  REACT_APP_ADMIN_PORT: "3001"
  REACT_APP_ADMIN_API_URL: "http://localhost"
  REACT_APP_ADMIN_GRAPHQL_URL: "/graphql"
  REACT_APP_ADMIN_WS_URL: "ws://localhost/graphql"
  REACT_APP_GRAFANA_URL: "http://localhost:30002"

  # Environment
  NODE_ENV: "development"
