# keycloak: OIDC identity provider for EconGraph (realm `econ-graph`).
#
# Served under /idp on the shared ingress host (keycloak-ingress.yaml), so the
# issuer is ${KC_HOSTNAME}/realms/econ-graph.
#
# Secrets come from the Secret `keycloak-secrets`, created out of band by
# scripts/deploy/create-keycloak-secret.sh (called from scripts/deploy/deploy.sh):
#   admin-username, admin-password  bootstrap admin for the Keycloak console
#   db-password                     keycloak-postgres password
#   google-enabled, google-client-id, google-client-secret  (optional) Google IdP
#
# The realm comes from the ConfigMap `keycloak-realm`, generated by deploy.sh from
# config/keycloak/econ-graph-realm.json. Only the realm is imported here: the seeded
# test users in config/keycloak/dev/ are for the local compose stack and never
# deployed. Import skips a realm that already exists, so realm changes after the
# first start are made in the console or by a later AUTH PR's migration.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: econ-graph
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: econ-graph
  labels:
    app: keycloak
    component: auth
spec:
  # One replica: several need Keycloak's distributed cache configured first.
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        component: auth
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.4
        args: ["start", "--import-realm"]
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-username
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://keycloak-postgres-service:5432/keycloak"
        - name: KC_DB_USERNAME
          value: "keycloak"
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-password
        # Public URL, including the ingress path. Change for a real domain.
        - name: KC_HOSTNAME
          value: "http://localhost:8080/idp"
        - name: KC_HTTP_RELATIVE_PATH
          value: "/idp"
        # TLS terminates at the ingress controller.
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HEALTH_ENABLED
          value: "true"
        # Placeholders in config/keycloak/econ-graph-realm.json
        - name: KC_WEB_BASE_URL
          value: "http://localhost:8080"
        - name: KC_GOOGLE_ENABLED
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: google-enabled
              optional: true
        - name: KC_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: google-client-id
              optional: true
        - name: KC_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: google-client-secret
              optional: true
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: management
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # The first start builds Keycloak's optimized image, which takes a while.
        startupProbe:
          httpGet:
            path: /idp/health/started
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /idp/health/live
            port: management
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /idp/health/ready
            port: management
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: realm
        configMap:
          name: keycloak-realm
      securityContext:
        seccompProfile:
          type: RuntimeDefault
