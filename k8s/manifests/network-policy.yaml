# The gateway's Envoy proxy pods (k8s/manifests/gateway/) are selected by
# namespace envoy-gateway-system plus the labels Envoy Gateway puts on the
# proxy of Gateway econ-graph-gateway/econ-graph-gateway. They are admitted
# only to the pods and ports the routes send traffic to: the frontend (3000),
# the backend (9876) and Keycloak (8080). Policies match the proxy's pod ports
# (listener http 10080, https 10443), not its Service port 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: econ-graph-network-policy
  namespace: econ-graph
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: econ-graph
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS outbound
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP outbound (for health checks)
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow egress to the gateway's Envoy proxy, for in-cluster callers of
  # econ-graph-gateway-proxy.envoy-gateway-system.svc.cluster.local (the
  # backend's server-side calls, an in-cluster tunnel connector)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
          gateway.envoyproxy.io/owning-gateway-name: econ-graph-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: econ-graph-gateway
    ports:
    - protocol: TCP
      port: 10080
    - protocol: TCP
      port: 10443
  # Allow inter-pod communication within namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: econ-graph
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: econ-graph-backend-policy
  namespace: econ-graph
spec:
  podSelector:
    matchLabels:
      app: econ-graph-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from frontend
  - from:
    - podSelector:
        matchLabels:
          app: econ-graph-frontend
    - podSelector:
        matchLabels:
          app: econ-graph-admin-frontend
    - podSelector:
        matchLabels:
          app: chart-api-service
  # Allow ingress from the gateway's Envoy proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
          gateway.envoyproxy.io/owning-gateway-name: econ-graph-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: econ-graph-gateway
    ports:
    - protocol: TCP
      port: 9876
  egress:
  # Allow egress to PostgreSQL (both pod and service)
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to PostgreSQL service
  - to:
    - namespaceSelector:
        matchLabels:
          name: econ-graph
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to the gateway's Envoy proxy, for in-cluster calls through
  # econ-graph-gateway-proxy.envoy-gateway-system.svc.cluster.local
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
          gateway.envoyproxy.io/owning-gateway-name: econ-graph-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: econ-graph-gateway
    ports:
    - protocol: TCP
      port: 10080
    - protocol: TCP
      port: 10443
  # Allow egress to Keycloak, for the signing keys that verify access tokens
  - to:
    - podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8080
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: econ-graph-frontend-policy
  namespace: econ-graph
spec:
  podSelector:
    matchLabels:
      app: econ-graph-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from the gateway's Envoy proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
          gateway.envoyproxy.io/owning-gateway-name: econ-graph-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: econ-graph-gateway
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow egress to backend
  - to:
    - podSelector:
        matchLabels:
          app: econ-graph-backend
    ports:
    - protocol: TCP
      port: 9876
  # Allow egress to chart-api
  - to:
    - podSelector:
        matchLabels:
          app: chart-api-service
    ports:
    - protocol: TCP
      port: 3001
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS outbound for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Keycloak's public paths (HTTPRoute econ-graph-idp) from the gateway's proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: econ-graph-keycloak-policy
  namespace: econ-graph
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy
          gateway.envoyproxy.io/owning-gateway-name: econ-graph-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: econ-graph-gateway
    ports:
    - protocol: TCP
      port: 8080
