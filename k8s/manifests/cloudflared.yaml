# cloudflared: the Cloudflare Tunnel connector that serves the public site
# (PUBLIC_HOST in scripts/deploy/deploy.sh, https://econgraph.com) from this cluster.
#
# Traffic: browser -> Cloudflare edge (TLS) -> this tunnel (outbound-only from
# the cluster, no inbound port is opened on the host) -> the gateway -> the app.
# The tunnel is remotely managed: its public hostnames and their origin service
# are set in the Cloudflare dashboard (Zero Trust > Networks > Tunnels), not here.
# Each public hostname (econgraph.com, www.econgraph.com) points at
#   https://econ-graph-gateway-proxy.envoy-gateway-system.svc.cluster.local:443
# with No TLS Verify on and no HTTP Host header override: cloudflared passes the
# visitor's Host through, which is what the public routes match on.
# The origin is the gateway's https listener so that the scheme the gateway
# passes on as X-Forwarded-Proto is the connection's own: no client header can
# claim https, and plain http for the public host is redirected to https
# (scripts/deploy/render-public-host.py). The certificate is self-signed
# (k8s/manifests/gateway/selfsigned-issuer.yaml), hence No TLS Verify; this hop
# never leaves the cluster, and the tunnel itself to Cloudflare is
# authenticated TLS. The visitor's address reaches the gateway in
# X-Forwarded-For, which it trusts from pod addresses only
# (k8s/manifests/gateway/client-traffic-policy.yaml). The NetworkPolicy
# econ-graph-network-policy lets this pod reach the gateway's proxy (its pod
# port 10443). See "Public site" in k8s/README.md.
#
# The tunnel token comes only from the Secret cloudflare-tunnel (key token),
# written by scripts/deploy/create-secrets.sh --prompt-tunnel-token (hidden
# input); it is never committed.
#
# Only the production cluster may run this connector (ECO-468): every
# cloudflared started with the token joins the same tunnel, and Cloudflare
# silently spreads the site's traffic across all of them. So the Deployment is
# committed with replicas: 0, and applying it, or all of k8s/manifests, never
# starts it (on production it stops it until the next deploy). apply_cloudflared
# in scripts/deploy/lib/public-host.sh scales it up, only on a cluster marked
# with scripts/deploy/mark-production-cluster.sh that has a PUBLIC_HOST and the
# Secret.
#
# Metrics: GET /metrics on :2000, scraped by the annotation-based kubernetes-pods
# job in k8s/monitoring/prometheus-config.yaml; alerts are in
# k8s/monitoring/prometheus-rules-tunnel.yaml. GET /ready on the same port
# answers 200 once the connector holds at least one connection to the edge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: econ-graph
  labels:
    app: cloudflared
    component: tunnel
spec:
  # 0 as committed; apply_cloudflared sets CLOUDFLARED_REPLICAS on production
  # (see the header). With 2+ replicas, uncomment the pod anti-affinity below.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new connector before stopping the old one, so a rollout
      # never leaves the tunnel without a connection.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
        component: tunnel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #     - labelSelector:
      #         matchLabels:
      #           app: cloudflared
      #       topologyKey: kubernetes.io/hostname
      containers:
      - name: cloudflared
        # cloudflare/cloudflared:2026.10.3, pinned by its (multi-arch index)
        # digest; bump the tag and digest together, deliberately (release notes:
        # https://github.com/cloudflare/cloudflared/releases).
        image: cloudflare/cloudflared@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel
              key: token
        ports:
        - containerPort: 2000
          name: metrics
        livenessProbe:
          httpGet:
            path: /ready
            port: metrics
          # Generous: a short edge outage should not restart the connector,
          # which reconnects on its own; a wedged one is restarted after ~2 min.
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          # The image's nonroot user; a numeric id lets the kubelet verify runAsNonRoot.
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
