apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: econ-graph-ingress
  namespace: econ-graph
  annotations:
    # CORS is enforced by the backend from CORS_ALLOWED_ORIGINS; no ingress CORS annotations.
    # /graphql has its own rate-limited Ingress in graphql-ingress.yaml; apply
    # both manifests together, or /graphql has no route.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: econ-graph-admin-frontend-service
            port:
              number: 3001
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: econ-graph-backend-service
            port:
              number: 9876
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: econ-graph-backend-service
            port:
              number: 9876
      # /graphql is served by graphql-ingress.yaml, which rate-limits it.
      # The OIDC sign-in callback is a frontend route; Exact wins over the /auth prefix below.
      - path: /auth/callback
        pathType: Exact
        backend:
          service:
            name: econ-graph-frontend-service
            port:
              number: 3000
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: econ-graph-backend-service
            port:
              number: 9876
      - path: /playground
        pathType: Prefix
        backend:
          service:
            name: econ-graph-backend-service
            port:
              number: 9876
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: econ-graph-backend-service
            port:
              number: 9876
      - path: /
        pathType: Prefix
        backend:
          service:
            name: econ-graph-frontend-service
            port:
              number: 3000
