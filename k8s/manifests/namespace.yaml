# econgraph.io/gateway-access lets this namespace's HTTPRoutes attach to the
# Gateway's http listener, and econgraph.io/env: production to its https
# listener (k8s/manifests/gateway/).
apiVersion: v1
kind: Namespace
metadata:
  name: econ-graph
  labels:
    name: econ-graph
    app: econ-graph
    econgraph.io/env: production
    econgraph.io/gateway-access: "true"
