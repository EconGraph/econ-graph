apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: econ-graph
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        # Pinned by tag and multi-arch index digest; bump both together.
        image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
        ports:
        - containerPort: 9090
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus/'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--storage.tsdb.retention.time=30d'
        - '--web.enable-lifecycle'
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Prometheus needs to write to /prometheus
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      # Every prometheus-rules-*.yaml ConfigMap, projected into one directory
      # (/etc/prometheus/rules, rule_files in prometheus-config.yaml).
      - name: prometheus-rules
        projected:
          sources:
          - configMap:
              name: prometheus-rules-crawler
          - configMap:
              name: prometheus-rules-tunnel
          - configMap:
              name: prometheus-rules-auth
      - name: prometheus-storage
        emptyDir: {}
