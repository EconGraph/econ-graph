# Crawler alerts.
#
# Metric names/labels come from econ-graph-metrics (src/crawler.rs), recorded by the
# crawler-worker's HttpFetcher (econ-graph-crawler/src/http.rs):
#   econgraph_crawler_requests_total{crawler_type,source,endpoint,status}
#   econgraph_crawler_request_duration_seconds_bucket{crawler_type,source,endpoint,le}
#   econgraph_crawler_errors_total{crawler_type,source,error_type}
#   econgraph_crawler_rate_limit_hits_total{crawler_type,source}
#   econgraph_crawler_retries_total{crawler_type,source,retry_reason}
#   econgraph_crawler_timeouts_total{crawler_type,source}
# Label meaning in the new crawler: crawler_type = source id lower-cased ("fred", "bls",
# ...), source = upstream host ("api.stlouisfed.org"). Per-source alerts therefore group
# by crawler_type.
#
# KNOWN GAPS (not fixed here):
# - The econgraph_crawler_* metrics live in econ-graph-metrics' DEFAULT_REGISTRY, which
#   no process currently serves over HTTP: crawler-worker has no /metrics endpoint and the
#   backend's /metrics uses its own registry. Until the worker exposes DEFAULT_REGISTRY
#   (and gets a scrape target), the econgraph_crawler_* rules below cannot fire. The
#   crawler.absent rules make that visible instead of failing silently.
# - There is no queue-depth / job-completion metric (nothing exports crawl_queue counts),
#   so "queue growing / no completions in 1h" cannot be alerted on yet. It needs e.g. a
#   gauge of crawl_queue rows by status and a counter of completed jobs from the worker.
# - The in-repo Prometheus (prometheus-config.yaml) is not operator-managed and its
#   rule_files are commented out, so this PrometheusRule is only picked up on clusters
#   running the Prometheus Operator (the CRD must exist for `kubectl apply` to succeed).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crawler-alerts
  namespace: econ-graph
  labels:
    role: alert-rules
spec:
  groups:
  - name: crawler.worker
    rules:
    # kube-state-metrics (deployed in k8s/monitoring) provides these.
    - alert: CrawlerWorkerDown
      expr: kube_deployment_status_replicas_available{namespace="econ-graph", deployment="crawler-worker"} < 1
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: crawler-worker has no available pod
        description: The crawler-worker Deployment has had no available replica for 10 minutes; crawl_queue is not being drained.

    - alert: CrawlerWorkerRestarting
      expr: increase(kube_pod_container_status_restarts_total{namespace="econ-graph", container="crawler-worker"}[1h]) > 3
      labels:
        severity: warning
      annotations:
        summary: crawler-worker is restarting repeatedly
        description: The crawler-worker container restarted {{ $value | humanize }} times in the last hour (check DATABASE_URL / logs).

  - name: crawler.absent
    rules:
    - alert: CrawlerMetricsMissing
      expr: absent(econgraph_crawler_requests_total) and on() (kube_deployment_status_replicas_available{namespace="econ-graph", deployment="crawler-worker"} >= 1)
      for: 1h
      labels:
        severity: info
      annotations:
        summary: No crawler request metrics are being scraped
        description: crawler-worker is running but econgraph_crawler_requests_total is absent; the worker's metrics are not exported/scraped, so the other crawler alerts cannot fire.

  - name: crawler.rules
    interval: 30s
    rules:
    # Denominator filtered with `> 0` so idle periods give no result instead of dividing
    # by zero (the previous clamp_max(..., 1) capped the denominator at 1 req/s, which
    # inflated or hid the ratio).
    - alert: CrawlerHighErrorRate
      expr: sum(rate(econgraph_crawler_errors_total[5m])) / (sum(rate(econgraph_crawler_requests_total[5m])) > 0) > 0.05
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: High crawler error rate (>5%)
        description: Crawler error rate is above 5% for 10 minutes.

    - alert: CrawlerHighErrorRateBySource
      expr: sum by (crawler_type) (rate(econgraph_crawler_errors_total[5m])) / (sum by (crawler_type) (rate(econgraph_crawler_requests_total[5m])) > 0) > 0.05
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: High crawler error rate (>5%) for source {{ $labels.crawler_type }}
        description: Error rate is above 5% for 10 minutes for source {{ $labels.crawler_type }}.

    - alert: CrawlerFrequentRateLimitHits
      expr: sum(rate(econgraph_crawler_rate_limit_hits_total[15m])) > 0.5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Frequent 429 rate limit hits
        description: Crawlers are frequently hitting upstream rate limits.

    - alert: CrawlerFrequentRateLimitHitsBySource
      expr: sum by (crawler_type) (rate(econgraph_crawler_rate_limit_hits_total[15m])) > 0.1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Frequent 429 rate limit hits for {{ $labels.crawler_type }}
        description: Rate limit hits are frequent for source {{ $labels.crawler_type }}; its SourcePolicy rate may be too high (or more than one worker replica is running).

    - alert: CrawlerHighTimeouts
      expr: sum(rate(econgraph_crawler_timeouts_total[10m])) > 0.2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Elevated crawler timeouts
        description: Timeout rate exceeds threshold.

    - alert: CrawlerHighTimeoutsBySource
      expr: sum by (crawler_type) (rate(econgraph_crawler_timeouts_total[10m])) > 0.05
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Elevated crawler timeouts for {{ $labels.crawler_type }}
        description: Timeout rate exceeds threshold for source {{ $labels.crawler_type }}.

    - alert: CrawlerHighLatencyP95
      expr: histogram_quantile(0.95, sum by (le) (rate(econgraph_crawler_request_duration_seconds_bucket[5m]))) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: High crawler p95 latency (>5s)
        description: 95th percentile of request latency is above 5 seconds.

    - alert: CrawlerHighLatencyP95BySource
      expr: histogram_quantile(0.95, sum by (le, crawler_type) (rate(econgraph_crawler_request_duration_seconds_bucket[5m]))) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: High p95 latency (>5s) for {{ $labels.crawler_type }}
        description: 95th percentile of request latency is above 5 seconds for source {{ $labels.crawler_type }}.

    # The worker only makes requests when due jobs exist, so an empty queue also yields
    # zero traffic; this is a warning, not critical. Per-source "no traffic" alerts were
    # dropped: sources are crawled on their own schedules and an idle source is normal.
    - alert: CrawlerNoTraffic
      expr: sum(rate(econgraph_crawler_requests_total[15m])) == 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: No crawler traffic detected
        description: The crawler has made no upstream requests for over an hour (queue empty, all sources paused, or worker stuck).
