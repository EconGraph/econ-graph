# Cloudflare Tunnel alerts: the public site (https://econgraph.com) reaches the cluster only
# through the cloudflared Deployment (k8s/manifests/cloudflared.yaml), so when it is down or
# holds no connection to Cloudflare's edge the site is down for every visitor, even though
# everything checked on the host (http://localhost) still works.
#
# Metrics:
#   kube_deployment_spec_replicas / kube_deployment_status_replicas_available
#       from kube-state-metrics (deployed in k8s/monitoring).
#   cloudflared_tunnel_ha_connections   gauge; open connections from this connector to the
#       edge (normally 4 per replica). Served by cloudflared on :2000/metrics; its pod
#       template carries prometheus.io/scrape|port|path annotations, so the annotation-based
#       'kubernetes-pods' job in prometheus-config.yaml scrapes it and maps the pod label
#       app=cloudflared onto the series.
#
# deploy.sh runs cloudflared with replicas: 0 while the Secret cloudflare-tunnel is missing
# (no tunnel configured); both alerts stay quiet then, since they only fire when the
# Deployment asks for a replica.
#
# Loading: like prometheus-rules-crawler.yaml, a plain ConfigMap projected into
# /etc/prometheus/rules by prometheus-deployment.yaml. Tests: tests/tunnel.test.yaml, run by
# check-prometheus-rules.sh in CI.
#
# KNOWN GAP: no Alertmanager is deployed, so firing alerts are visible in Prometheus
# (/alerts, the ALERTS series) but are not routed or notified anywhere.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules-tunnel
  namespace: econ-graph
data:
  tunnel.rules.yml: |
      groups:
      - name: tunnel
        rules:
        - alert: CloudflareTunnelDown
          expr: |
            (max(kube_deployment_spec_replicas{namespace="econ-graph", deployment="cloudflared"}) > 0)
            unless on()
            (max(kube_deployment_status_replicas_available{namespace="econ-graph", deployment="cloudflared"}) > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: cloudflared has no available pod; the public site is down
            description: The cloudflared Deployment wants a replica but has had none available for 5 minutes, so nothing serves the public hostnames. Check `kubectl -n econ-graph describe deployment cloudflared` and the pod's events (a missing cloudflare-tunnel Secret shows as CreateContainerConfigError).

        # Also fires when the pod runs but its metrics are not scraped, since then no
        # connection count is known either.
        - alert: CloudflareTunnelNoConnections
          expr: |
            (max(kube_deployment_status_replicas_available{namespace="econ-graph", deployment="cloudflared"}) > 0)
            unless on()
            (sum(cloudflared_tunnel_ha_connections{app="cloudflared"}) > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: cloudflared is running but holds no tunnel connection; the public site is down
            description: cloudflared has an available pod but has reported no connection to Cloudflare's edge for 5 minutes (or its :2000/metrics is not being scraped). Check `kubectl -n econ-graph logs deployment/cloudflared`; an invalid or revoked token, or a tunnel deleted in the dashboard, shows up there.
