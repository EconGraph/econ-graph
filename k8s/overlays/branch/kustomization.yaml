    \            value: xforwarded\n          - name: KC_HEALTH_ENABLED\n        \
    \    value: 'true'\n          - name: KC_ANONYMOUS_CLIENT_SECRET\n           \
    \ valueFrom:\n              secretKeyRef:\n                name: econ-graph-keycloak\n\
    \                key: anonymous-client-secret\n          - name: KC_HOSTNAME\n\
    \            value: http://example-50d858e098.localhost/idp\n          - name:\
