    \              port: management\n            periodSeconds: 5\n            timeoutSeconds:\
    \ 3\n            failureThreshold: 3\n          securityContext:\n           \
    \ runAsNonRoot: true\n            runAsUser: 1000\n            allowPrivilegeEscalation:\
