    \ 86400\n    template:\n      metadata:\n        labels:\n          app: keycloak-realm-import\n\
    \          component: auth\n      spec:\n        restartPolicy: Never\n      \
    \  automountServiceAccountToken: false\n        initContainers:\n        - name:\
