# Example branch overlay. deploy-branch.sh renders the actual branch identity and images.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- extras.yaml
patches:
- target:
    kind: ConfigMap
    name: econ-graph-config
    version: v1
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n\
    - op: replace\n  path: /data\n  value:\n    BACKEND_PORT: '9876'\n    FRONTEND_PORT:\
    \ '3000'\n    ADMIN_FRONTEND_PORT: '3001'\n    DATABASE_PORT: '5432'\n    RUST_LOG:\
    \ info\n    CORS_ORIGIN: http://example-50d858e098.localhost\n    CHART_API_SERVICE_URL:\
    \ ''\n    NODE_ENV: development\n"
- target:
    kind: Deployment
    name: econ-graph-backend
    version: v1
    group: apps
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n\
    - op: replace\n  path: /spec\n  value:\n    replicas: 1\n    selector:\n     \
    \ matchLabels:\n        app: econ-graph-backend\n    template:\n      metadata:\n\
    \        labels:\n          app: econ-graph-backend\n          component: backend\n\
    \      spec:\n        initContainers:\n        - name: wait-for-postgres\n   \
    \       image: busybox:1.38\n          command:\n          - sh\n          - -c\n\
    \          args:\n          - \"echo \\\"Waiting for PostgreSQL to be ready...\\\
    \"\\nuntil nc -z app-postgres-service\\\n            \\ 5432; do\\n  echo \\\"\
    PostgreSQL is unavailable - sleeping\\\"\\n  sleep 2\\n\\\n            done\\\
    necho \\\"PostgreSQL is ready!\\\"\\n\"\n          resources:\n            requests:\n\
    \              memory: 16Mi\n              cpu: 10m\n            limits:\n   \
    \           memory: 32Mi\n              cpu: 50m\n          securityContext:\n\
    \            runAsNonRoot: true\n            runAsUser: 1000\n            allowPrivilegeEscalation:\
    \ false\n            readOnlyRootFilesystem: true\n            capabilities:\n\
    \              drop:\n              - ALL\n            seccompProfile:\n     \
    \         type: RuntimeDefault\n        containers:\n        - name: backend\n\
    \          image: econ-graph-backend:branch-example\n          imagePullPolicy:\
    \ IfNotPresent\n          ports:\n          - containerPort: 9876\n          \
    \  name: http\n          env:\n          - name: BACKEND_PORT\n            valueFrom:\n\
    \              configMapKeyRef:\n                name: econ-graph-config\n   \
    \             key: BACKEND_PORT\n          - name: FRONTEND_PORT\n           \
    \ valueFrom:\n              configMapKeyRef:\n                name: econ-graph-config\n\
    \                key: FRONTEND_PORT\n          - name: APP_DATABASE_URL\n    \
    \        valueFrom:\n              secretKeyRef:\n                name: econ-graph-secrets\n\
    \                key: app-database-url\n          - name: RUST_LOG\n         \
    \   valueFrom:\n              configMapKeyRef:\n                name: econ-graph-config\n\
    \                key: RUST_LOG\n          - name: REFERENCE_DATA_DIR\n       \
    \     value: /app/reference\n          - name: CRAWLER_DATA_DIR\n            value:\
    \ /app/data\n          - name: CORS_ALLOWED_ORIGINS\n            valueFrom:\n\
    \              configMapKeyRef:\n                name: econ-graph-config\n   \
    \             key: CORS_ORIGIN\n          - name: OIDC_ANONYMOUS_ALLOW_INSECURE_HTTP\n\
    \            value: 'true'\n          - name: OIDC_ANONYMOUS_TOKEN_URL\n     \
    \       value: http://keycloak-service:8080/idp/realms/econ-graph/protocol/openid-connect/token\n\
    \          - name: OIDC_ANONYMOUS_CLIENT_SECRET\n            valueFrom:\n    \
    \          secretKeyRef:\n                name: econ-graph-keycloak\n        \
    \        key: anonymous-client-secret\n          - name: ANONYMOUS_GRANTS_STALE_MAX_SECS\n\
    \            value: '0'\n          - name: OIDC_AUDIENCE\n            value: econ-graph-api\n\
    \          - name: OIDC_JWKS_URL\n            value: http://keycloak-service:8080/idp/realms/econ-graph/protocol/openid-connect/certs\n\
    \          - name: OIDC_REQUIRED\n            value: 'true'\n          - name:\
    \ OIDC_ISSUER\n            value: http://example-50d858e098.localhost/idp/realms/econ-graph\n\
    \          - name: DATA_GRAPHQL_URL\n            value: http://econ-graph-gateway-proxy.envoy-gateway-system.svc.cluster.local/data/graphql\n\
    \          - name: DATA_GRAPHQL_HOST\n            value: example-50d858e098.localhost\n\
    \          resources:\n            requests:\n              memory: 256Mi\n  \
    \            cpu: 100m\n            limits:\n              memory: 512Mi\n   \
    \           cpu: 500m\n          startupProbe:\n            httpGet:\n       \
    \       path: /readyz\n              port: 9876\n            initialDelaySeconds:\
    \ 10\n            periodSeconds: 5\n            timeoutSeconds: 3\n          \
    \  failureThreshold: 30\n          livenessProbe:\n            httpGet:\n    \
    \          path: /livez\n              port: 9876\n            initialDelaySeconds:\
    \ 30\n            periodSeconds: 10\n            timeoutSeconds: 3\n         \
    \   failureThreshold: 3\n          readinessProbe:\n            httpGet:\n   \
    \           path: /readyz\n              port: 9876\n            initialDelaySeconds:\
    \ 15\n            periodSeconds: 5\n            timeoutSeconds: 3\n          \
    \  failureThreshold: 3\n          securityContext:\n            runAsNonRoot:\
    \ true\n            runAsUser: 1000\n            allowPrivilegeEscalation: false\n\
    \            readOnlyRootFilesystem: true\n            capabilities:\n       \
    \       drop:\n              - ALL\n            seccompProfile:\n            \
    \  type: RuntimeDefault\n        securityContext:\n          fsGroup: 1000\n \
    \         seccompProfile:\n            type: RuntimeDefault\n        restartPolicy:\
    \ Always\n        automountServiceAccountToken: false\n"
- target:
    kind: Service
    name: econ-graph-backend-service
    version: v1
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n\
    - op: replace\n  path: /spec\n  value:\n    type: ClusterIP\n    ports:\n    -\
    \ port: 9876\n      targetPort: 9876\n      protocol: TCP\n      name: http\n\
    \    selector:\n      app: econ-graph-backend\n"
- target:
    kind: Deployment
    name: econ-graph-frontend
    version: v1
    group: apps
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n\
    - op: replace\n  path: /spec\n  value:\n    replicas: 1\n    selector:\n     \
    \ matchLabels:\n        app: econ-graph-frontend\n    template:\n      metadata:\n\
    \        labels:\n          app: econ-graph-frontend\n          component: frontend\n\
    \      spec:\n        containers:\n        - name: frontend\n          image:\
    \ econ-graph-frontend:branch-example\n          imagePullPolicy: IfNotPresent\n\
    \          ports:\n          - containerPort: 3000\n            name: http\n \
    \         env: []\n          resources:\n            requests:\n             \
    \ memory: 128Mi\n              cpu: 50m\n            limits:\n              memory:\
    \ 256Mi\n              cpu: 200m\n          livenessProbe:\n            httpGet:\n\
    \              path: /\n              port: 3000\n            initialDelaySeconds:\
    \ 30\n            periodSeconds: 10\n          readinessProbe:\n            httpGet:\n\
    \              path: /\n              port: 3000\n            initialDelaySeconds:\
    \ 5\n            periodSeconds: 5\n          volumeMounts:\n          - name:\
    \ nginx-cache\n            mountPath: /var/cache/nginx\n          - name: nginx-run\n\
    \            mountPath: /var/run\n          securityContext:\n            runAsNonRoot:\
    \ true\n            runAsUser: 1000\n            allowPrivilegeEscalation: false\n\
    \            readOnlyRootFilesystem: true\n            capabilities:\n       \
    \       drop:\n              - ALL\n            seccompProfile:\n            \
    \  type: RuntimeDefault\n        securityContext:\n          fsGroup: 1000\n \
    \         seccompProfile:\n            type: RuntimeDefault\n        volumes:\n\
    \        - name: nginx-cache\n          emptyDir: {}\n        - name: nginx-run\n\
    \          emptyDir: {}\n        restartPolicy: Always\n        automountServiceAccountToken:\
    \ false\n"
- target:
    kind: Service
    name: econ-graph-frontend-service
    version: v1
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n\
    - op: replace\n  path: /spec\n  value:\n    type: ClusterIP\n    ports:\n    -\
    \ port: 3000\n      targetPort: 3000\n      protocol: TCP\n      name: http\n\
    \    selector:\n      app: econ-graph-frontend\n"
- target:
    kind: ConfigMap
    name: app-postgres-init
    version: v1
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n"
- target:
    kind: Service
    name: app-postgres-service
    version: v1
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n"
- target:
    kind: StatefulSet
    name: app-postgres
    version: v1
    group: apps
  patch: "- op: add\n  path: /metadata/namespace\n  value: econ-graph-br-example-50d858e098\n\
    - op: replace\n  path: /spec\n  value:\n    serviceName: app-postgres-service\n\
    \    replicas: 1\n    selector:\n      matchLabels:\n        app: app-postgres\n\
    \    template:\n      metadata:\n        labels:\n          app: app-postgres\n\
    \          version: '18'\n      spec:\n        initContainers:\n        - name:\
    \ init-data-dir\n          image: postgres:18\n          command:\n          -\
    \ sh\n          - -ec\n          - \"root=\\\"$1\\\"; pgdata=\\\"$2\\\"\\n# The\
    \ host directory starts out owned by\\\n            \\ the operator account. Postgres\
    \ runs\\n# as 999 and has to create PGDATA\\\n            \\ inside it, so hand\
    \ the volume root over.\\nchown 999:999 \\\"$root\\\"\\n\\\n            chmod\
    \ 0700 \\\"$root\\\"\\n# A data directory restored by a copy that didn't\\\n \
    \           \\ keep ownership (anything\\n# but 999:999) would stop Postgres starting;\\\
    \n            \\ fix it once.\\nif [ -e \\\"$pgdata\\\" ] && [ \\\"$(stat -c %u:%g\
    \ \\\"$pgdata\\\"\\\n            )\\\" != \\\"999:999\\\" ]; then\\n  echo \\\"\
    fixing ownership of $pgdata\\\"\\n \\\n            \\ chown -R 999:999 \\\"$pgdata\\\
    \"\\nfi\\nstat -c '%n %u:%g %a' \\\"$root\\\"\\n\"\n          - init-data-dir\n\
    \          - /data\n          - /data/pgdata\n          volumeMounts:\n      \
    \    - name: app-postgres-data\n            mountPath: /data\n          securityContext:\n\
    \            runAsUser: 0\n            runAsNonRoot: false\n            allowPrivilegeEscalation:\
    \ false\n            readOnlyRootFilesystem: true\n            capabilities:\n\
    \              drop:\n              - ALL\n              add:\n              -\
    \ CHOWN\n              - FOWNER\n              - DAC_READ_SEARCH\n           \
    \ seccompProfile:\n              type: RuntimeDefault\n        containers:\n \
    \       - name: postgres\n          image: postgres:18\n          ports:\n   \
    \       - containerPort: 5432\n            name: postgres\n          env:\n  \
    \        - name: POSTGRES_DB\n            value: econ_graph_app\n          - name:\
    \ POSTGRES_USER\n            value: postgres\n          - name: POSTGRES_PASSWORD\n\
    \            valueFrom:\n              secretKeyRef:\n                name: econ-graph-app-postgres\n\
    \                key: postgres-password\n          - name: APP_DB_PASSWORD\n \
    \           valueFrom:\n              secretKeyRef:\n                name: econ-graph-app-postgres\n\
    \                key: app-password\n          - name: PGDATA\n            value:\
    \ /data/pgdata\n          volumeMounts:\n          - name: app-postgres-data\n\
    \            mountPath: /data\n          - name: app-postgres-init\n         \
    \   mountPath: /docker-entrypoint-initdb.d\n          resources:\n           \
    \ requests:\n              memory: 256Mi\n              cpu: 100m\n          \
    \  limits:\n              memory: 1Gi\n              cpu: 500m\n          securityContext:\n\
    \            runAsNonRoot: true\n            runAsUser: 999\n            allowPrivilegeEscalation:\
    \ false\n            capabilities:\n              drop:\n              - ALL\n\
    \            seccompProfile:\n              type: RuntimeDefault\n          livenessProbe:\n\
    \            exec:\n              command:\n              - pg_isready\n     \
    \         - -U\n              - postgres\n              - -d\n              -\
    \ econ_graph_app\n            initialDelaySeconds: 30\n            periodSeconds:\
    \ 10\n            timeoutSeconds: 5\n            failureThreshold: 3\n       \
    \   readinessProbe:\n            exec:\n              command:\n             \
    \ - pg_isready\n              - -U\n              - postgres\n              -\
    \ -d\n              - econ_graph_app\n            initialDelaySeconds: 5\n   \
    \         periodSeconds: 5\n            timeoutSeconds: 3\n            failureThreshold:\
    \ 3\n        volumes:\n        - name: app-postgres-init\n          configMap:\n\
    \            name: app-postgres-init\n            defaultMode: 365\n        securityContext:\n\
    \          fsGroup: 999\n        automountServiceAccountToken: false\n    volumeClaimTemplates:\n\
    \    - metadata:\n        name: app-postgres-data\n      spec:\n        accessModes:\n\
    \        - ReadWriteOnce\n        storageClassName: standard\n        resources:\n\
    \          requests:\n            storage: 2Gi\n"
