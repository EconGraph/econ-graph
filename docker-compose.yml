version: '3.8'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: econ_graph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/econ_graph
      RUST_LOG: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Keycloak (OIDC identity provider) with the dev realm `econ-graph`.
  # Realm and seeded test users live in config/keycloak/; see its README.
  # --import-realm skips a realm that already exists, so after the realm file
  # changes, stop keycloak and keycloak-db and remove the keycloak_db_data volume.
  keycloak-db:
    image: postgres:18
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # Enable the Google identity provider only when its client id and secret are configured.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ "$${KC_GOOGLE_CLIENT_ID:-unset}" != unset ] && [ "$${KC_GOOGLE_CLIENT_SECRET:-unset}" != unset ]; then export KC_GOOGLE_ENABLED=true; fi
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
      # Placeholders in config/keycloak/econ-graph-realm.json
      KC_REALM_SSL_REQUIRED: none
      KC_WEB_BASE_URL: http://localhost:3000
      # Frontend origin of the release e2e stack
      KC_WEB_E2E_BASE_URL: http://localhost:18081
      KC_WEB_DIRECT_GRANTS: "true"
      KC_GOOGLE_CLIENT_ID: ${KEYCLOAK_GOOGLE_CLIENT_ID:-unset}
      KC_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_GOOGLE_CLIENT_SECRET:-unset}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./config/keycloak/econ-graph-realm.json:/opt/keycloak/data/import/econ-graph-realm.json:ro
      - ./config/keycloak/dev/econ-graph-users-0.json:/opt/keycloak/data/import/econ-graph-users-0.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Development services
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/econ_graph
      RUST_LOG: debug
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
    environment:
      REACT_APP_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules

  # Testing services
  test-postgres:
    profiles: ["test"]
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: econ_graph_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:password@test-postgres:5432/econ_graph_test
    depends_on:
      test-postgres:
        condition: service_healthy
    command: cargo test --verbose
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: npm test -- --coverage
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules

volumes:
  postgres_data:
  keycloak_db_data:
  cargo_cache:
  target_cache:
  node_modules_cache:
