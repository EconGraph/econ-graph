# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  # Suppress skipped-review notices, including draft PR notices.
  review_status: false
  # Squash merges use the PR description as the commit body, so keep CodeRabbit's
  # summary in its walkthrough comment instead of writing it into the description.
  high_level_summary_in_walkthrough: true
  # Keep generated files and docs-only changes out of review scope to cut
  # noise and save CodeRabbit review quota.
  path_filters:
    - "!**/schema.graphql"
    - "!frontend/flags/*.json"
    - "!backend/flags/*.json"
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
    - "!**/*.md"
