name: Temporary FRED First-Page Scope Counts

# TEMP audit branch only. Evidence still requires independent membership/budget review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fred-count-only-audit
  cancel-in-progress: false

jobs:
  fred-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout dispatched revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        ref: ${{ github.sha }}

    - name: Free runner disk before cache restoration
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /usr/local/.ghcup \
          /usr/share/swift /usr/local/share/powershell
        df -h /

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

    - name: Restore shared backend cache without saving
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: backend
        shared-key: backend
        save-if: false

    - name: Run offline audit-tool tests
      run: python3 -m unittest discover -s scripts/tests -p 'test_audit_fred_selection.py' -v

    # No API key is injected during compilation or dependency resolution.
    - name: Compile ignored exporter test without credentials
      run: |
        cargo test --locked --manifest-path backend/Cargo.toml -p econ-graph-crawler --lib \
          --no-run --message-format=json > "$RUNNER_TEMP/fred-build.json"
        python3 - <<'PYTHON'
        import json, os
        from pathlib import Path
        messages = Path(os.environ['RUNNER_TEMP'], 'fred-build.json').read_text().splitlines()
        binaries = [m['executable'] for m in map(json.loads, messages)
                    if m.get('reason') == 'compiler-artifact' and m.get('executable')
                    and m.get('target', {}).get('name') == 'econ_graph_crawler'
                    and m.get('profile', {}).get('test') is True
                    and 'lib' in m.get('target', {}).get('kind', [])]
        if len(binaries) != 1:
            raise SystemExit('Expected exactly one crawler lib test executable')
        Path(os.environ['RUNNER_TEMP'], 'fred-test-binary.txt').write_text(binaries[0])
        PYTHON

    - name: Run exact ignored first-page scope-counts test
      id: audit
      continue-on-error: true
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        python3 scripts/audit-fred-selection.py \
          --mode scope-counts \
          --binary "$(cat "$RUNNER_TEMP/fred-test-binary.txt")" \
          --data-dir backend/crates/econ-graph-crawler/data \
          --output "$RUNNER_TEMP/fred-scope-safe" \
          --revision '${{ github.sha }}'

    - name: Upload verified immutable evidence and sanitized logs
      if: ${{ always() && steps.audit.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fred-scope-counts-${{ github.sha }}
        path: ${{ runner.temp }}/fred-scope-safe/
        if-no-files-found: error
        retention-days: 7

    - name: Preserve actual audit failure
      if: ${{ always() && steps.audit.outcome != 'skipped' }}
      run: |
        status=$(cat "$RUNNER_TEMP/fred-scope-safe/exit-status.txt")
        case "$status" in ''|*[!0-9]*) exit 2 ;; esac
        exit "$status"
