name: Crawler Integration Test

# Manually triggered; does NOT run automatically. Fetches one real series through a source
# adapter and the worker's persistence (`crawler fetch`), then checks the queue path
# (`crawler enqueue` + `crawler status`). Needs network access to the chosen source.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id (FRED, BLS, WORLD_BANK, ...; see `crawler sources`)'
        required: false
        type: string
        default: 'FRED'
      series:
        description: 'Series id at that source'
        required: false
        type: string
        default: 'GDP'
      api_key_fred:
        description: 'FRED API key (optional)'
        required: false
        type: string
        default: ''
      api_key_bls:
        description: 'BLS API key (optional)'
        required: false
        type: string
        default: ''
      api_key_census:
        description: 'Census API key (optional)'
        required: false
        type: string
        default: ''

# Prevent concurrent runs to avoid database conflicts
concurrency:
  group: crawler-integration-test
  cancel-in-progress: false

jobs:
  crawler-integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: econ_graph_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/econ_graph_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Diesel CLI
      run: cargo install diesel_cli --no-default-features --features postgres
      working-directory: backend

    - name: Run migrations
      run: diesel migration run
      working-directory: backend

    - name: Build crawler CLI
      run: cargo build --release -p econ-graph-crawler --bin crawler
      working-directory: backend

    - name: Fetch one series and check the queue
      env:
        FRED_API_KEY: ${{ github.event.inputs.api_key_fred }}
        BLS_API_KEY: ${{ github.event.inputs.api_key_bls }}
        CENSUS_API_KEY: ${{ github.event.inputs.api_key_census }}
        SOURCE: ${{ github.event.inputs.source }}
        SERIES: ${{ github.event.inputs.series }}
      run: |
        set -euo pipefail
        CRAWLER=target/release/crawler
        $CRAWLER sources
        $CRAWLER fetch --source "$SOURCE" --series "$SERIES" --full
        $CRAWLER enqueue --source "$SOURCE" --series "$SERIES"
        $CRAWLER status
      working-directory: backend
