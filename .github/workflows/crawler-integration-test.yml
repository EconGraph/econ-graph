name: Crawler Integration Test

# Manually triggered; does NOT run automatically. Enqueues one real series (`crawler enqueue`),
# runs `crawler-worker` until that job finishes, and checks the job completed and its data points
# were stored. Needs network access to the chosen source. API keys come only from the
# FRED_API_KEY / BLS_API_KEY / CENSUS_API_KEY repository secrets;
# FRED and Census need one.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id (FRED, BLS, WORLD_BANK, ...; see `crawler sources`)'
        required: false
        type: string
        default: 'FRED'
      series:
        description: 'Series id at that source'
        required: false
        type: string
        default: 'GDP'

# Prevent concurrent runs to avoid database conflicts
concurrency:
  group: crawler-integration-test
  cancel-in-progress: false

jobs:
  crawler-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: econ_graph_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # diesel and psql read DATABASE_URL; the crawler CLI and worker read DATA_DATABASE_URL.
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/econ_graph_test
      DATA_DATABASE_URL: postgres://test_user:test_password@localhost:5432/econ_graph_test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Diesel CLI
      run: cargo install diesel_cli --no-default-features --features postgres
      working-directory: backend

    - name: Run migrations
      run: |
        diesel migration run --migration-dir migrations/data
        diesel migration run --migration-dir migrations/app
      working-directory: backend

    - name: Build crawler CLI and worker
      run: cargo build --release -p econ-graph-crawler --bin crawler -p econ-graph-crawler-worker --bin crawler-worker
      working-directory: backend

    - name: Crawl one series through the queue
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        SOURCE: ${{ github.event.inputs.source }}
        SERIES: ${{ github.event.inputs.series }}
      run: |
        set -euo pipefail
        # Rust str::trim uses Unicode White_Space, including nonbreaking spaces.
        SERIES=$(python3 - <<'PY'
        import os
        whitespace = "\t\n\v\f\r \u0085\u00a0\u1680" + "".join(map(chr, range(0x2000, 0x200b))) + "\u2028\u2029\u202f\u205f\u3000"
        print(os.environ["SERIES"].strip(whitespace), end="")
        PY
        )
        if [[ -z "$SERIES" || "$SERIES" == *,* ]]; then
          echo "::error::The integration test requires exactly one nonempty series id"
          exit 1
        fi
        if [ "${SOURCE^^}" = "FRED" ] && [ -z "$FRED_API_KEY" ]; then
          echo "::error::FRED needs an API key: set the FRED_API_KEY secret"
          exit 1
        fi
        if [ "${SOURCE^^}" = "CENSUS" ] && [ -z "$CENSUS_API_KEY" ]; then
          echo "::error::Census needs an API key: set the CENSUS_API_KEY secret"
          exit 1
        fi
        CRAWLER=target/release/crawler
        $CRAWLER sources
        $CRAWLER enqueue --source "$SOURCE" --series "$SERIES"

        # One worker for this source only, without the refresh scheduler, so the queue holds
        # just the job enqueued above.
        CRAWLER_SOURCES="$SOURCE" CRAWLER_SCHEDULER=false CRAWLER_POLL_INTERVAL_SECS=1 \
          target/release/crawler-worker > worker.log 2>&1 &
        WORKER_PID=$!
        trap 'kill "$WORKER_PID" 2>/dev/null || true; cat worker.log' EXIT

        job_status() {
          psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -v source="$SOURCE" -v series="$SERIES" <<'SQL'
        SELECT status FROM crawl_queue
          WHERE kind = 'fetch_series' AND source = UPPER(:'source') AND series_id = :'series'
          ORDER BY created_at DESC LIMIT 1;
        SQL
        }
        status=""
        for _ in $(seq 1 300); do
          status=$(job_status)
          case "$status" in completed|failed) break ;; esac
          sleep 2
        done
        $CRAWLER status
        if [ "$status" != "completed" ]; then
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v source="$SOURCE" -v series="$SERIES" <<'SQL'
        SELECT status, retry_count, error_message FROM crawl_queue
          WHERE source = UPPER(:'source') AND series_id = :'series';
        SQL
          echo "::error::Queue job for $SOURCE/$SERIES ended as '${status:-still pending}', not completed"
          exit 1
        fi

        points=$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -v series="$SERIES" <<'SQL'
        SELECT COUNT(*) FROM data_points dp
          JOIN economic_series es ON es.id = dp.series_id
          WHERE es.external_id = :'series';
        SQL
        )
        echo "Stored $points data points for $SOURCE/$SERIES"
        if [ "$points" -eq 0 ]; then
          echo "::error::The job completed but stored no data points"
          exit 1
        fi
      working-directory: backend
