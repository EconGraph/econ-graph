name: Temporary FRED Count-Only Audit

# TEMP audit branch only. Counts do not establish complete membership/witness coverage.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fred-count-only-audit
  cancel-in-progress: false

jobs:
  fred-count-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout dispatched revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        ref: ${{ github.sha }}

    - name: Free runner disk before cache restoration
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /usr/local/.ghcup \
          /usr/share/swift /usr/local/share/powershell
        df -h /

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

    - name: Restore shared backend cache without saving
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: backend
        shared-key: backend
        save-if: false

    - name: Run offline audit-tool tests
      run: python3 -m unittest discover -s scripts/tests -p 'test_audit_fred_selection.py' -v

    # No API key is injected during compilation or dependency resolution.
    - name: Build crawler only
      run: cargo build --locked --manifest-path backend/Cargo.toml -p econ-graph-crawler --bin crawler

    - name: Run read-only COUNT-ONLY audit
      id: audit
      continue-on-error: true
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        python3 scripts/audit-fred-selection.py \
          --binary backend/target/debug/crawler \
          --data-dir backend/crates/econ-graph-crawler/data \
          --output "$RUNNER_TEMP/fred-count-sanitized" \
          --revision '${{ github.sha }}'

    - name: Upload only sanitized count artifacts
      if: ${{ always() && steps.audit.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fred-count-only-${{ github.sha }}
        path: ${{ runner.temp }}/fred-count-sanitized/
        if-no-files-found: error
        retention-days: 7

    - name: Preserve actual audit failure
      if: ${{ always() && steps.audit.outcome != 'skipped' }}
      run: |
        status=$(cat "$RUNNER_TEMP/fred-count-sanitized/exit-status.txt")
        case "$status" in ''|*[!0-9]*) exit 2 ;; esac
        exit "$status"
