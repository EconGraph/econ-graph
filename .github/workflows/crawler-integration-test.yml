name: Temporary FRED History Count Profile

# TEMP branch only. Samples are never full-fetch or operating-budget acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

# Shared across branches with full inventory: never use the key quota concurrently.
concurrency:
  group: fred-count-only-audit
  cancel-in-progress: false

jobs:
  fred-count-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout dispatched revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        ref: ${{ github.sha }}

    - name: Run offline profile tests without credentials
      run: python3 -m unittest discover -s scripts/tests -p 'test_profile_fred_history_counts.py' -v

    - name: Run bounded sequential count-only sample
      id: profile
      continue-on-error: true
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        set +e
        timeout --signal=TERM --kill-after=5s 930s \
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 FRED_API_KEY="$FRED_API_KEY" \
          python3 scripts/profile-fred-history-counts.py \
          --output "$RUNNER_TEMP/fred-history-count-safe" --revision '${{ github.sha }}'
        status=$?
        mkdir -p "$RUNNER_TEMP/fred-history-count-safe"
        printf '%s\n' "$status" > "$RUNNER_TEMP/fred-history-count-safe/exit-status.txt"
        if [ -f "$RUNNER_TEMP/fred-history-count-safe/profile.json" ]; then
          sha256sum "$RUNNER_TEMP/fred-history-count-safe/profile.json" | cut -d ' ' -f 1 \
            > "$RUNNER_TEMP/fred-history-count-safe/profile.sha256"
        fi
        exit "$status"

    - name: Upload only safe count profile and actual exit status
      if: ${{ always() && steps.profile.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fred-history-count-${{ github.sha }}
        path: |
          ${{ runner.temp }}/fred-history-count-safe/profile.json
          ${{ runner.temp }}/fred-history-count-safe/profile.sha256
          ${{ runner.temp }}/fred-history-count-safe/exit-status.txt
        if-no-files-found: error
        retention-days: 7

    - name: Preserve actual profile failure
      if: ${{ always() && steps.profile.outcome != 'skipped' }}
      run: |
        status=$(cat "$RUNNER_TEMP/fred-history-count-safe/exit-status.txt")
        case "$status" in ''|*[!0-9]*) exit 2 ;; esac
        exit "$status"
