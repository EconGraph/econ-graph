name: Crawler Integration Test

# Manually triggered; does NOT run automatically. Enqueues one real series (`crawler enqueue`),
# runs `crawler-worker` until that job finishes, and checks the job completed and its data points
# were stored. Needs network access to the chosen source. API keys come from the dispatch inputs
# or, when those are empty, the FRED_API_KEY / BLS_API_KEY / CENSUS_API_KEY repository secrets;
# FRED needs one.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id (FRED, BLS, WORLD_BANK, ...; see `crawler sources`)'
        required: false
        type: string
        default: 'FRED'
      series:
        description: 'Series id at that source'
        required: false
        type: string
        default: 'GDP'
      api_key_fred:
        description: 'FRED API key (defaults to the FRED_API_KEY secret; FRED needs one)'
        required: false
        type: string
        default: ''
      api_key_bls:
        description: 'BLS API key (optional; defaults to the BLS_API_KEY secret)'
        required: false
        type: string
        default: ''
      api_key_census:
        description: 'Census API key (optional; defaults to the CENSUS_API_KEY secret)'
        required: false
        type: string
        default: ''

# Prevent concurrent runs to avoid database conflicts
concurrency:
  group: crawler-integration-test
  cancel-in-progress: false

jobs:
  crawler-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: econ_graph_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/econ_graph_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Diesel CLI
      run: cargo install diesel_cli --no-default-features --features postgres
      working-directory: backend

    - name: Run migrations
      run: diesel migration run
      working-directory: backend

    - name: Build crawler CLI and worker
      run: cargo build --release -p econ-graph-crawler --bin crawler -p econ-graph-crawler-worker --bin crawler-worker
      working-directory: backend

    - name: Crawl one series through the queue
      env:
        FRED_API_KEY: ${{ github.event.inputs.api_key_fred || secrets.FRED_API_KEY }}
        BLS_API_KEY: ${{ github.event.inputs.api_key_bls || secrets.BLS_API_KEY }}
        CENSUS_API_KEY: ${{ github.event.inputs.api_key_census || secrets.CENSUS_API_KEY }}
        SOURCE: ${{ github.event.inputs.source }}
        SERIES: ${{ github.event.inputs.series }}
      run: |
        set -euo pipefail
        if [ "${SOURCE^^}" = "FRED" ] && [ -z "$FRED_API_KEY" ]; then
          echo "::error::FRED needs an API key: pass api_key_fred or set the FRED_API_KEY secret"
          exit 1
        fi
        CRAWLER=target/release/crawler
        $CRAWLER sources
        $CRAWLER enqueue --source "$SOURCE" --series "$SERIES"

        # One worker for this source only, without the refresh scheduler, so the queue holds
        # just the job enqueued above.
        CRAWLER_SOURCES="$SOURCE" CRAWLER_SCHEDULER=false CRAWLER_POLL_INTERVAL_SECS=1 \
          target/release/crawler-worker > worker.log 2>&1 &
        WORKER_PID=$!
        trap 'kill "$WORKER_PID" 2>/dev/null || true; cat worker.log' EXIT

        job_status() {
          psql "$DATABASE_URL" -Atc "SELECT status FROM crawl_queue
            WHERE kind = 'fetch_series' AND source = UPPER('$SOURCE') AND series_id = '$SERIES'
            ORDER BY created_at DESC LIMIT 1"
        }
        status=""
        for _ in $(seq 1 300); do
          status=$(job_status)
          case "$status" in completed|failed) break ;; esac
          sleep 2
        done
        $CRAWLER status
        if [ "$status" != "completed" ]; then
          psql "$DATABASE_URL" -c "SELECT status, retry_count, error_message FROM crawl_queue
            WHERE source = UPPER('$SOURCE') AND series_id = '$SERIES'"
          echo "::error::Queue job for $SOURCE/$SERIES ended as '${status:-still pending}', not completed"
          exit 1
        fi

        points=$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM data_points dp
          JOIN economic_series es ON es.id = dp.series_id
          WHERE es.external_id = '$SERIES'")
        echo "Stored $points data points for $SOURCE/$SERIES"
        if [ "$points" -eq 0 ]; then
          echo "::error::The job completed but stored no data points"
          exit 1
        fi
      working-directory: backend
