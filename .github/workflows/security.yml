name: Security and Dependency Updates

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          backend/target
        key: ${{ runner.os }}-cargo-audit-${{ hashFiles('backend/Cargo.lock') }}

    - name: Install cargo-audit and cargo-deny
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
      with:
        tool: cargo-audit@0.22.2,cargo-deny@0.20.2

    - name: Validate patched dependency implementations
      run: |
        python3 scripts/check_security_adapters.py
        python3 -m unittest discover -s scripts -p test_security_adapters.py -v
        cargo test --locked -p zstd@0.13.3 -p quick-xml@0.39.4 -p thrift@0.17.0 --doc
      working-directory: backend

    # The same gates as the PR-time Security Audit in ci-core.yml, run daily so an
    # advisory published against an unchanged lockfile still fails a run. Exceptions
    # live in backend/.cargo/audit.toml and backend/deny.toml (Rust) and in each
    # package's scripts/npm-audit-allowlist.json (npm), each with a reason.
    - name: Run Rust security audit
      run: |
        cargo audit
        cargo deny check advisories
      working-directory: backend

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: '.nvmrc'

    # check-npm-audit.mjs checks minimatch compatibility against frontend's install.
    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Run npm security audits
      run: |
        node frontend/scripts/check-npm-audit.mjs frontend
        node frontend/scripts/check-npm-audit.mjs admin-frontend --allowlist admin-frontend/scripts/npm-audit-allowlist.json
        node frontend/scripts/check-npm-audit.mjs chart-api-service --allowlist chart-api-service/scripts/npm-audit-allowlist.json
        node frontend/scripts/check-npm-audit.mjs frontend/dev-server --allowlist frontend/dev-server/scripts/npm-audit-allowlist.json
        node frontend/scripts/check-npm-audit.mjs . --allowlist scripts/npm-audit-allowlist.json

    - name: Check the audits fail on a known-vulnerable dependency
      # Also on a run where a real audit above already failed.
      if: ${{ !cancelled() }}
      run: scripts/security/test-audit-gates.sh

  report-audit-failure:
    name: Report audit failure
    needs: [security-audit]
    # A scheduled run has no PR to fail, so its failure goes to an issue: one open
    # issue, commented on by each later failing run. GitHub also emails the failure
    # to whoever last changed this workflow's schedule.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Open or update the audit failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="Nightly dependency audit is failing"
        body="The nightly Security Audit failed: $RUN_URL. Fix the advisory or add a reviewed exception (see docs/development/MERGE_QUEUE.md, \"When a new advisory blocks the queue\")."
        number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
          --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
        if [ -n "$number" ]; then
          gh issue comment "$number" --body "$body"
        else
          gh issue create --title "$title" --body "$body"
        fi

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

