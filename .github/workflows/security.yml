  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: ${{ matrix.language }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

    - name: Install cargo-license
      run: cargo install cargo-license

    - name: Check Rust licenses
      run: |
        cargo license --json > rust-licenses.json
        echo "Rust dependency licenses:"
        cargo license
      working-directory: backend

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: '.nvmrc'

    - name: Install license-checker
      run: npm install -g license-checker

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Check npm licenses
      run: |
        license-checker --json > npm-licenses.json
        echo "npm dependency licenses:"
        license-checker --summary

        echo "Checking admin-frontend npm licenses..."
        cd ../admin-frontend
        license-checker --json > admin-frontend-npm-licenses.json
        echo "Admin frontend npm dependency licenses:"
        license-checker --summary
      working-directory: frontend

    - name: Upload license reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: license-reports
        path: |
          backend/rust-licenses.json
          frontend/npm-licenses.json
          admin-frontend/admin-frontend-npm-licenses.json

  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build backend image for scanning
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: econ-graph-backend:scan
        cache-from: type=gha

    - name: Build frontend image for scanning
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        load: true
        tags: econ-graph-frontend:scan
        cache-from: type=gha

    - name: Scan backend image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'econ-graph-backend:scan'
        format: 'sarif'
        output: 'backend-trivy.sarif'

    - name: Scan frontend image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'econ-graph-frontend:scan'
        format: 'sarif'
        output: 'frontend-trivy.sarif'

    - name: Upload backend scan results
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      if: always()
      with:
        sarif_file: 'backend-trivy.sarif'
        category: 'backend-docker'

    - name: Upload frontend scan results
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      if: always()
      with:
        sarif_file: 'frontend-trivy.sarif'
        category: 'frontend-docker'

