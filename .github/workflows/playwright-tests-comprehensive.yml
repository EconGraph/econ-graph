name: Comprehensive Playwright Tests

on:
  # Manual only: this suite predates the Vite frontend migration (it still uses
  # `cargo run --bin migrate`, which no longer exists, and CRA-era `npm start`/
  # REACT_APP_* env vars) and the release process's release/vX.Y branch +
  # vX.Y.Z(-rc.N) tag scheme (see docs/development/RELEASE_PROCESS.md), so it
  # must not auto-fire on release tags. ci-core.yml and release-e2e.yml cover
  # Playwright/E2E coverage on pushes and PRs.
  workflow_dispatch:

jobs:
  playwright-tests:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: econ_graph_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Build backend
      working-directory: ./backend
      run: cargo build --release
      env:
        APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/econ_graph_test
        DATA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/econ_graph_test

    - name: Run database migrations
      working-directory: ./backend
      run: cargo run -p econ-graph-crawler --bin crawler -- migrate
      env:
        APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/econ_graph_test
        DATA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/econ_graph_test

    - name: Start backend server
      working-directory: ./backend
      run: |
        cargo run --release &
        sleep 10
      env:
        APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/econ_graph_test
        DATA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/econ_graph_test
        BACKEND_PORT: 8080
        FRONTEND_PORT: 3000

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      env:
        REACT_APP_API_URL: http://localhost:8080

    - name: Start frontend server
      working-directory: ./frontend
      run: |
        npm start &
        sleep 30
      env:
        PORT: 3000
        REACT_APP_API_URL: http://localhost:8080

    - name: Wait for services to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

    - name: Run Playwright tests
      working-directory: ./frontend
      run: npx playwright test --reporter=github
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000

    - name: Upload Playwright Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: playwright-report-${{ github.ref_name }}
        path: frontend/playwright-report/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: playwright-test-results-${{ github.ref_name }}
        path: frontend/test-results/
        retention-days: 30

    - name: Upload screenshots
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: failure()
      with:
        name: playwright-screenshots-${{ github.ref_name }}
        path: frontend/test-results/
        retention-days: 7

