name: Accessibility Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run accessibility tests on (leave empty for current branch)"
        required: false
        default: ""
        type: string
      test_type:
        description: "Type of accessibility tests to run"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "static"
          - "runtime"
          - "manual"
  pull_request:
    paths:
      - "frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/accessibility-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/accessibility-tests.yml"
  schedule:
    # Run every Monday at 9 AM UTC (weekly accessibility audit)
    - cron: "0 9 * * 1"

env:
  NODE_VERSION: "24"

permissions:
  contents: read

jobs:
  accessibility-static-analysis:
    name: Accessibility Static Analysis (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'all' || inputs.test_type == 'static' }}
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, admin-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install locked dependencies
        id: install
        shell: bash
        run: |
          mkdir -p accessibility-results
          set -o pipefail
          npm ci 2>&1 | tee accessibility-results/static-install.log
      - name: Run accessibility static checks
        id: audit
        shell: bash
        run: |
          set -o pipefail
          npm run lint:accessibility -- --format json --output-file accessibility-results/static.json 2>&1 | tee accessibility-results/static.log
      - name: Record check outcomes
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          mkdir -p accessibility-results
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("accessibility-results/static-status.json", JSON.stringify({
              project: "${{ matrix.project }}", check: "static",
              install: process.env.INSTALL_RESULT, audit: process.env.AUDIT_RESULT
            }));'
          echo "${{ matrix.project }} static: install=$INSTALL_RESULT, audit=$AUDIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve reports and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-static-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ matrix.project }}/accessibility-results/
          retention-days: 7

  accessibility-runtime-tests:
    name: Accessibility Runtime Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'all' || inputs.test_type == 'runtime' }}
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, admin-frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install locked dependencies
        id: install
        shell: bash
        run: |
          mkdir -p accessibility-results
          set -o pipefail
          npm ci 2>&1 | tee accessibility-results/runtime-install.log
      - name: Run accessibility runtime checks
        id: audit
        shell: bash
        run: |
          set -o pipefail
          npm run test:accessibility 2>&1 | tee accessibility-results/runtime.log
      - name: Record check outcomes
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          mkdir -p accessibility-results
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("accessibility-results/runtime-status.json", JSON.stringify({
              project: "${{ matrix.project }}", check: "runtime",
              install: process.env.INSTALL_RESULT, audit: process.env.AUDIT_RESULT
            }));'
          echo "${{ matrix.project }} runtime: install=$INSTALL_RESULT, audit=$AUDIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve reports and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-runtime-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ matrix.project }}/accessibility-results/
          retention-days: 7

  accessibility-manual-tests:
    name: Accessibility Manual Testing Guidelines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'manual' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Generate accessibility testing report
        run: |
          echo "# Accessibility Testing Report" > accessibility-test-report.md
          echo "" >> accessibility-test-report.md
          echo "## Automated Checks (see job results)" >> accessibility-test-report.md
          echo "- ESLint with jsx-a11y plugin configured" >> accessibility-test-report.md
          echo "- Complete recommended jsx-a11y rules audited" >> accessibility-test-report.md
          echo "- Covers ARIA, roles, and semantic HTML" >> accessibility-test-report.md
          echo "" >> accessibility-test-report.md
          echo "## Runtime Check Scope" >> accessibility-test-report.md
          echo "- axe-core integration configured" >> accessibility-test-report.md
          echo "- axe checks in jsdom; browser and manual checks remain necessary" >> accessibility-test-report.md
          echo "- Vitest integration for automated testing" >> accessibility-test-report.md
          echo "" >> accessibility-test-report.md
          echo "## Manual Testing Checklist" >> accessibility-test-report.md
          echo "### Keyboard Navigation" >> accessibility-test-report.md
          echo "- [ ] Tab navigation works correctly" >> accessibility-test-report.md
          echo "- [ ] Focus indicators are visible" >> accessibility-test-report.md
          echo "- [ ] Skip links are available" >> accessibility-test-report.md
          echo "" >> accessibility-test-report.md
          echo "### Screen Reader Testing" >> accessibility-test-report.md
          echo "- [ ] All interactive elements are announced" >> accessibility-test-report.md
          echo "- [ ] Form labels are properly associated" >> accessibility-test-report.md
          echo "- [ ] ARIA labels are descriptive" >> accessibility-test-report.md
          echo "" >> accessibility-test-report.md
          echo "### Visual Accessibility" >> accessibility-test-report.md
          echo "- [ ] Color contrast meets WCAG AA standards" >> accessibility-test-report.md
          echo "- [ ] Text is readable at 200% zoom" >> accessibility-test-report.md
          echo "- [ ] No content relies solely on color" >> accessibility-test-report.md
          echo "" >> accessibility-test-report.md
          echo "### Mobile Accessibility" >> accessibility-test-report.md
          echo "- [ ] Touch targets are at least 44px" >> accessibility-test-report.md
          echo "- [ ] Gestures work with assistive technology" >> accessibility-test-report.md
          echo "- [ ] Orientation changes are supported" >> accessibility-test-report.md

      - name: Upload accessibility testing report
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-manual-${{ github.run_attempt }}
          path: accessibility-test-report.md
          retention-days: 30

  accessibility-summary:
    name: Accessibility Testing Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        accessibility-static-analysis,
        accessibility-runtime-tests,
        accessibility-manual-tests,
      ]
    if: always()
    steps:
      - name: Download accessibility reports
        uses: actions/download-artifact@v4
        with:
          pattern: accessibility-*-${{ github.run_attempt }}
          path: accessibility-results
      - name: Summarize actual job and check outcomes
        if: always()
        env:
          STATIC_RESULT: ${{ needs.accessibility-static-analysis.result }}
          RUNTIME_RESULT: ${{ needs.accessibility-runtime-tests.result }}
          MANUAL_RESULT: ${{ needs.accessibility-manual-tests.result }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          lines = ['# Accessibility Testing Summary', '', '| Job | Result |', '| --- | --- |']
          for name in ['STATIC', 'RUNTIME', 'MANUAL']:
              lines.append(f'| {name.lower()} | {os.environ[name + "_RESULT"]} |')
          lines += ['', '| Project | Check | Install | Audit |', '| --- | --- | --- | --- |']
          reports = list(Path('accessibility-results').rglob('*-status.json'))
          for file in sorted(reports):
              report = json.loads(file.read_text())
              lines.append('| ' + ' | '.join(report[key] for key in ['project', 'check', 'install', 'audit']) + ' |')
          if not reports:
              lines += ['', 'No per-project outcome reports were available. Consult job logs; missing reports do not imply a pass.']
          lines += ['', 'Static checks use ESLint jsx-a11y; runtime checks use Vitest and axe-core.',
                    'A skipped audit did not run. A manual checklist is guidance, not a completed audit.',
                    'Run locally in either project: `npm ci`, `npm run lint:accessibility`, `npm run test:accessibility`.',
                    'jsdom cannot fully check layout, contrast, keyboard use or screen reader behavior; browser/manual audits remain necessary.']
          summary = '\n'.join(lines) + '\n'
          Path('accessibility-summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary)
          PYTHON
      - name: Upload accessibility summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-summary-${{ github.run_attempt }}
          path: accessibility-summary.md
          retention-days: 30
      - name: Fail summary when a required job failed or was cancelled
        if: always()
        env:
          STATIC_RESULT: ${{ needs.accessibility-static-analysis.result }}
          RUNTIME_RESULT: ${{ needs.accessibility-runtime-tests.result }}
          MANUAL_RESULT: ${{ needs.accessibility-manual-tests.result }}
        run: |
          for result in "$STATIC_RESULT" "$RUNTIME_RESULT" "$MANUAL_RESULT"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done
