name: Playwright Tests (Deployed)

on:
  # Manual only: this suite runs against a deployed application at
  # PLAYWRIGHT_BASE_URL (falling back to http://localhost, which is never
  # reachable in CI), so it cannot auto-fire on release tags without a
  # deployment step. Trigger it by hand once a target is actually deployed
  # (e.g. during the release process's QA phase; see
  # docs/development/RELEASE_PROCESS.md).
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL of the deployed application to test'
        required: false
        type: string

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps

    - name: Run Playwright tests against deployed application
      working-directory: ./frontend
      run: npx playwright test --reporter=github
      env:
        # This assumes the application is deployed and accessible
        PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || vars.PLAYWRIGHT_BASE_URL || 'http://localhost' }}

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ github.ref_name }}
        path: frontend/playwright-report/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results-${{ github.ref_name }}
        path: frontend/test-results/
        retention-days: 30

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-screenshots-${{ github.ref_name }}
        path: frontend/test-results/
        retention-days: 7

