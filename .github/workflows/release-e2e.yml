name: Release E2E

# The release end-to-end suite (frontend/playwright.release.config.ts): the frontend release
# build against the backend on Postgres 18, seeded from recorded fixtures. No network access to
# any data source and no API keys. See frontend/tests/e2e/release/README.md.
#
# The QA scenario suite (scripts/qa/, docs/release/qa-scenarios.md) runs with its ci profile
# against the same stack, set up the same way, as a second leg of the matrix.

on:
  # No branch filter: pull requests into another feature branch (stacked PRs)
  # run this suite too.
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'config/keycloak/**'
      - 'docker-compose.release-e2e.yml'
      - 'scripts/release-e2e.sh'
      - 'scripts/tests/test_release_e2e.py'
      - 'scripts/qa/**'
      - 'scripts/deploy/check-public-site.sh'
      - '.github/workflows/release-e2e.yml'
  workflow_dispatch:

# One run per pull request: a new push cancels the run for the previous head.
# Manual runs are keyed by commit and never cancelled. Same shape as ci-core.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same profile settings as ci-core.yml, so the shared Rust cache matches
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

jobs:
  release-e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release E2E (Chromium)
            suite: release
            config: playwright.release.config.ts
          - name: QA scenarios (ci profile)
            suite: qa-scenarios
            config: playwright.qa-stack.config.ts

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: econ_graph_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5439:5432

    env:
      # scripts/release-e2e.sh uses this instead of starting its own Postgres
      RELEASE_E2E_DATABASE_URL: postgres://postgres:password@localhost:5439/econ_graph_e2e
      RELEASE_E2E_CONFIG: ${{ matrix.config }}
      # The QA suite's accounts on this stack: the dev realm's grace and the Keycloak bootstrap
      # admin from docker-compose.release-e2e.yml. Development values, not secrets.
      QA_USERNAME: grace
      QA_PASSWORD: grace-dev-password
      QA_KEYCLOAK_ADMIN_USERNAME: admin
      QA_KEYCLOAK_ADMIN_PASSWORD: admin
      QA_REPORT: ${{ github.workspace }}/frontend/qa-scenarios-report.json

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

    - name: Cache release backend and fixture loader
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: backend
        # Core CI builds dev artifacts; this suite also needs optimized backend dependencies.
        # Save both profiles here so subsequent runs do not repeat a cold release build.
        shared-key: release-e2e
        save-if: ${{ matrix.suite == 'release' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Chromium
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Check release build orchestration
      run: python3 scripts/tests/test_release_e2e.py

    # The runner's guards (the production profile refuses state-changing scenarios) and each
    # scenario against a stub site, before the stack.
    - name: Check the QA scenario runner
      if: matrix.suite == 'qa-scenarios'
      run: python3 -m unittest discover -s scripts/qa/tests -v

    - name: Build, seed and run the ${{ matrix.suite }} suite
      run: scripts/release-e2e.sh

    - name: Upload the QA scenario report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always() && matrix.suite == 'qa-scenarios'
      with:
        name: qa-scenarios-report
        path: frontend/qa-scenarios-report.json
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Playwright report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: failure()
      with:
        name: ${{ matrix.suite }}-e2e-report
        path: |
          frontend/playwright-report-release/
          frontend/test-results-release/
          frontend/test-results-qa-stack/
        retention-days: 14
