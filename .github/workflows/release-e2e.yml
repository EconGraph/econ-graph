name: Release E2E

# The release end-to-end suite (frontend/playwright.release.config.ts): the frontend release
# build against the backend on Postgres 18, seeded from recorded fixtures. No network access to
# any data source and no API keys. See frontend/tests/e2e/release/README.md.

on:
  # No branch filter: pull requests into another feature branch (stacked PRs)
  # run this suite too. No path filter on the trigger: Release E2E Result is a
  # required check and must report on every PR; the changes job decides
  # whether the suite runs.
  pull_request:
  # The merge queue (docs/development/MERGE_QUEUE.md): the suite always runs
  # on the queued PRs merged onto their base branch.
  merge_group:
  workflow_dispatch:

# One run per pull request: a new push cancels the run for the previous head.
# Manual runs are keyed by commit and never cancelled. Same shape as ci-core.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same profile settings as ci-core.yml, so the shared Rust cache matches
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

jobs:
  # Whether a pull request touches what the suite runs on. Merge groups and
  # manual runs always run it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@v3
      id: filter
      if: github.event_name == 'pull_request'
      with:
        filters: |
          release:
            - 'frontend/**'
            - 'backend/**'
            - 'config/keycloak/**'
            - 'docker-compose.release-e2e.yml'
            - 'scripts/release-e2e.sh'
            - '.github/workflows/release-e2e.yml'
            - 'ci/scripts/check-required-jobs.sh'

  release-e2e:
    name: Release E2E (Chromium)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: econ_graph_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5439:5432

    env:
      # scripts/release-e2e.sh uses this instead of starting its own Postgres
      RELEASE_E2E_DATABASE_URL: postgres://postgres:password@localhost:5439/econ_graph_e2e

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.1

    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
        # Restore the cache ci-core.yml's build job saves; never save a second copy from here
        shared-key: backend
        save-if: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Chromium
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Build, seed and run the release suite
      run: scripts/release-e2e.sh

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: release-e2e-report
        path: |
          frontend/playwright-report-release/
          frontend/test-results-release/
        retention-days: 14

  # The one check branch protection requires of this workflow
  # (docs/development/MERGE_QUEUE.md): passes when the suite passed, or when a
  # pull request didn't touch what it runs on; in a merge group the suite must
  # have run and passed.
  result:
    name: Release E2E Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [changes, release-e2e]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: ci/scripts

    - name: Check the job results
      env:
        NEEDS: ${{ toJSON(needs) }}
        EVENT: ${{ github.event_name }}
        MUST_RUN: changes release-e2e
      run: ci/scripts/check-required-jobs.sh
